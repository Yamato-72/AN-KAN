<!DOCTYPE html>
<html lang="ja">
<head>

    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%232383e2'/><circle cx='90' cy='90' r='50' fill='none' stroke='%23fff' stroke-width='8'/><text x='90' y='108' text-anchor='middle' fill='%23fff' font-size='60' font-weight='bold' font-family='Arial'>¥</text></svg>">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        // PDF.js worker設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap');
        :root {
            --ui-bg: #f4f6f8;
            --ui-surface: #ffffff;
            --ui-surface-muted: #f8fafc;
            --ui-text: #172033;
            --ui-subtle: #64748b;
            --ui-line: #e2e8f0;
            --ui-brand: #2457d6;
            --ui-brand-strong: #1d46ad;
            --ui-brand-soft: #edf3ff;
            --ui-warning: #b45309;
            --ui-warning-soft: #fff7e8;
            --ui-success: #08775a;
            --ui-success-soft: #ecfdf5;
            --ui-danger: #c62828;
            --ui-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px rgba(15, 23, 42, .05);
        }
        html.dark {
            --ui-bg: #0f172a;
            --ui-surface: #172033;
            --ui-surface-muted: #1e293b;
            --ui-text: #f1f5f9;
            --ui-subtle: #94a3b8;
            --ui-line: #334155;
            --ui-brand: #7aa2ff;
            --ui-brand-strong: #9bb7ff;
            --ui-brand-soft: #1d2e55;
            --ui-warning: #fbbf24;
            --ui-warning-soft: #3b2b13;
            --ui-success: #5ee0b1;
            --ui-success-soft: #12352b;
            --ui-danger: #fb7185;
            --ui-shadow: 0 14px 34px rgba(0, 0, 0, .2);
        }
        * { font-family: 'Noto Sans JP', sans-serif; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--ui-bg); color: var(--ui-text); }
        button, a, select, input, textarea { font: inherit; }
        button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
            outline: 3px solid rgba(37, 99, 235, .28);
            outline-offset: 2px;
        }
        .tabular { font-variant-numeric: tabular-nums; }

        /* Loading / sign in */
        .auth-shell, .loading-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 18% 8%, rgba(37, 99, 235, .09), transparent 31%),
                radial-gradient(circle at 88% 88%, rgba(14, 165, 233, .07), transparent 28%),
                var(--ui-bg);
        }
        .auth-panel {
            width: min(100%, 430px);
            padding: 38px;
            border: 1px solid var(--ui-line);
            border-radius: 24px;
            background: var(--ui-surface);
            box-shadow: var(--ui-shadow);
        }
        .auth-mark, .brand-mark {
            display: inline-grid;
            place-items: center;
            color: white;
            background: linear-gradient(145deg, #2f67ea, #1944b3);
            box-shadow: 0 8px 18px rgba(36, 87, 214, .24);
        }
        .auth-mark { width: 52px; height: 52px; border-radius: 16px; font-size: 24px; font-weight: 800; }
        .auth-eyebrow { margin-top: 24px; color: var(--ui-brand); font-size: 11px; font-weight: 800; letter-spacing: .16em; }
        .auth-title { margin-top: 6px; color: var(--ui-text); font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
        .auth-copy { margin-top: 10px; color: var(--ui-subtle); font-size: 14px; line-height: 1.8; }
        .auth-button {
            width: 100%; margin-top: 28px; padding: 13px 18px; border: 0; border-radius: 12px;
            background: var(--ui-brand); color: white; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(36, 87, 214, .2);
        }
        .auth-button:hover { background: var(--ui-brand-strong); transform: translateY(-1px); }
        .auth-note { margin-top: 14px; color: var(--ui-subtle); font-size: 11px; text-align: center; }

        /* App shell */
        .payment-shell { min-height: 100vh; background: var(--ui-bg); }
        .payment-shell-header {
            position: sticky; top: 0; z-index: 40;
            border-bottom: 1px solid var(--ui-line);
            background: color-mix(in srgb, var(--ui-surface) 94%, transparent);
            backdrop-filter: blur(14px);
        }
        .payment-header-inner { width: min(100% - 32px, 1400px); margin: 0 auto; padding: 12px 0 10px; }
        .payment-header-row { display: flex; align-items: center; gap: 22px; }
        .brand-lockup { display: flex; align-items: center; gap: 10px; min-width: max-content; text-decoration: none; }
        .brand-mark { width: 34px; height: 34px; border-radius: 10px; font-size: 16px; font-weight: 900; }
        .brand-title { color: var(--ui-text); font-size: 16px; font-weight: 800; line-height: 1.2; }
        .brand-subtitle { color: var(--ui-subtle); font-size: 10px; margin-top: 2px; }
        .global-nav { display: flex; align-items: center; gap: 4px; }
        .global-nav a {
            padding: 8px 11px; border-radius: 9px; color: var(--ui-subtle);
            font-size: 12px; font-weight: 700; text-decoration: none;
        }
        .global-nav a:hover { color: var(--ui-text); background: var(--ui-surface-muted); }
        .global-nav a.active { color: var(--ui-brand); background: var(--ui-brand-soft); }
        .header-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
        .header-status { max-width: 190px; overflow: hidden; color: var(--ui-brand); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
        .shell-icon-button, .shell-tool-button {
            min-height: 36px; border: 1px solid var(--ui-line); border-radius: 10px;
            background: var(--ui-surface); color: var(--ui-subtle); cursor: pointer;
        }
        .shell-icon-button { min-width: 36px; padding: 7px; }
        .shell-tool-button { padding: 7px 11px; color: var(--ui-text); font-size: 12px; font-weight: 700; }
        .shell-icon-button:hover, .shell-tool-button:hover { color: var(--ui-brand); border-color: color-mix(in srgb, var(--ui-brand) 42%, var(--ui-line)); }
        .shell-menu {
            position: absolute; right: 0; width: 240px; margin-top: 8px; overflow: hidden;
            border: 1px solid var(--ui-line); border-radius: 14px; background: var(--ui-surface); box-shadow: var(--ui-shadow);
        }
        .shell-menu button { color: var(--ui-text); }
        .shell-menu button.menu-accent { color: var(--ui-brand); }
        .shell-menu button.menu-danger { color: var(--ui-danger); }
        .shell-menu-label { padding: 10px 14px 5px; color: var(--ui-subtle); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
        .payment-sync-row { display: flex; align-items: center; gap: 8px; margin: 7px 0 0 44px; color: var(--ui-subtle); font-size: 10px; }
        .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #16a34a; box-shadow: 0 0 0 3px rgba(22, 163, 74, .12); }
        .sync-divider { color: var(--ui-line); }
        .sync-refresh { border: 0; padding: 0; background: transparent; color: var(--ui-brand); cursor: pointer; }

        /* Content order: work first, metrics and settings later */
        .payment-main {
            width: min(100% - 32px, 1400px); margin: 0 auto; padding: 26px 0 100px;
            display: flex; flex-direction: column;
        }
        .priority-alerts { order: 0; margin-bottom: 14px; }
        .priority-heading { width: 100%; margin-bottom: 6px; }
        .priority-heading strong { display: block; font-size: 18px; letter-spacing: -.02em; }
        .priority-heading span { color: var(--ui-subtle); font-size: 11px; }
        .payment-queue { order: 1; margin-bottom: 16px !important; border: 1px solid #f2d59b !important; border-radius: 16px !important; background: var(--ui-surface) !important; box-shadow: var(--ui-shadow); }
        .payment-queue > button { border-radius: 16px !important; }
        .queue-title { display: flex; align-items: center; gap: 8px; }
        .queue-title h2 { color: var(--ui-text); font-size: 15px; font-weight: 800; }
        .queue-title p { margin-top: 2px; color: var(--ui-subtle); font-size: 10px; }
        .project-workspace { order: 2; margin-bottom: 22px; border: 1px solid var(--ui-line) !important; border-radius: 18px !important; background: var(--ui-surface) !important; box-shadow: var(--ui-shadow); }
        .payment-kpis { order: 3; gap: 10px !important; margin-bottom: 10px !important; }
        .payment-kpis-secondary { order: 4; }
        .payment-kpis-insights { order: 5; }
        .supplier-panel { order: 6; margin: 14px 0 0 !important; border: 1px solid var(--ui-line) !important; border-radius: 16px !important; background: var(--ui-surface) !important; box-shadow: none !important; }
        .metrics-heading { grid-column: 1 / -1; margin: 8px 0 1px; }
        .metrics-heading strong { font-size: 15px; }
        .metrics-heading span { margin-left: 8px; color: var(--ui-subtle); font-size: 10px; }
        .payment-kpis > div:not(.metrics-heading) {
            min-height: 94px; border: 1px solid var(--ui-line) !important; border-left-width: 1px !important;
            border-radius: 14px !important; background: var(--ui-surface) !important; box-shadow: none !important;
        }
        .payment-kpis > div:not(.metrics-heading) p:first-child { color: var(--ui-subtle) !important; font-weight: 600; }
        .payment-kpis > div:not(.metrics-heading) p:nth-child(2) { color: var(--ui-text) !important; font-variant-numeric: tabular-nums; }
        .workspace-tabs {
            top: 62px !important; margin-top: -8px !important; border-color: var(--ui-line) !important;
            border-radius: 14px 14px 0 0; background: var(--ui-surface) !important;
        }
        .workspace-tabs button { min-width: 120px; }
        .workspace-title-row h2 { color: var(--ui-text); font-size: 19px; letter-spacing: -.025em; }
        .workspace-title-row p { margin-top: 3px; color: var(--ui-subtle); font-size: 11px; }
        .primary-action {
            border-radius: 10px !important; background: var(--ui-brand) !important; font-weight: 700;
            box-shadow: 0 5px 14px rgba(36, 87, 214, .18);
        }
        .primary-action:hover { background: var(--ui-brand-strong) !important; }
        .workspace-filters { border: 1px solid var(--ui-line); border-radius: 12px !important; background: var(--ui-surface-muted) !important; }
        .workspace-filters select { min-height: 34px; border-color: var(--ui-line); border-radius: 8px !important; background: var(--ui-surface); color: var(--ui-text); }
        .project-card { overflow: hidden; border-width: 1px !important; border-color: var(--ui-line) !important; border-radius: 14px !important; background: var(--ui-surface) !important; box-shadow: 0 1px 2px rgba(15, 23, 42, .03); }
        .project-card:hover { border-color: color-mix(in srgb, var(--ui-brand) 34%, var(--ui-line)) !important; box-shadow: 0 8px 24px rgba(15, 23, 42, .06); }
        .project-card.is-due { border-left: 4px solid #e9a23b !important; }
        .project-card.is-complete { border-left: 4px solid #23a778 !important; }
        .project-card > div:first-child { background: var(--ui-surface); }
        .project-card button[title="削除"] { opacity: .62; }
        .project-card button[title="削除"]:hover { opacity: 1; }
        .project-product-clamp {
            display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
            line-height: 1.55;
        }
        .project-action-bar { display: flex; flex-wrap: wrap; gap: 8px; }
        .project-action-button {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            min-height: 36px; padding: 7px 11px; border: 1px solid var(--ui-line); border-radius: 9px;
            background: var(--ui-surface); color: var(--ui-text); font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer;
        }
        .project-action-button:hover { color: var(--ui-brand); border-color: color-mix(in srgb, var(--ui-brand) 45%, var(--ui-line)); background: var(--ui-brand-soft); }
        .project-action-button.is-danger { color: var(--ui-danger); }
        .project-action-button.is-danger:hover { border-color: color-mix(in srgb, var(--ui-danger) 45%, var(--ui-line)); background: color-mix(in srgb, var(--ui-danger) 8%, var(--ui-surface)); }

        /* Payment confirmation */
        .modal-backdrop {
            position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
            padding: 18px; background: rgba(15, 23, 42, .58); backdrop-filter: blur(3px);
        }
        .modal-panel {
            width: min(100%, 600px); max-height: 92vh; overflow-y: auto; border: 1px solid var(--ui-line);
            border-radius: 18px; background: var(--ui-surface); color: var(--ui-text); box-shadow: 0 24px 70px rgba(15, 23, 42, .28);
        }
        .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 22px 15px; border-bottom: 1px solid var(--ui-line); }
        .modal-eyebrow { color: var(--ui-brand); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
        .modal-title { margin-top: 3px; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
        .modal-copy { margin-top: 5px; color: var(--ui-subtle); font-size: 12px; line-height: 1.6; }
        .modal-close { width: 34px; height: 34px; border: 1px solid var(--ui-line); border-radius: 9px; background: var(--ui-surface); color: var(--ui-subtle); cursor: pointer; }
        .modal-body { padding: 18px 22px 22px; }
        .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .summary-item { padding: 11px 12px; border: 1px solid var(--ui-line); border-radius: 10px; background: var(--ui-surface-muted); }
        .summary-item dt { color: var(--ui-subtle); font-size: 10px; font-weight: 700; }
        .summary-item dd { margin-top: 3px; color: var(--ui-text); font-size: 14px; font-weight: 800; }
        .field-label { display: block; margin-bottom: 5px; color: var(--ui-subtle); font-size: 11px; font-weight: 700; }
        .form-control { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--ui-line); border-radius: 9px; background: var(--ui-surface); color: var(--ui-text); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }
        .button-secondary, .button-primary { min-height: 40px; padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; }
        .button-secondary { border: 1px solid var(--ui-line); background: var(--ui-surface); color: var(--ui-text); }
        .button-primary { border: 1px solid var(--ui-brand); background: var(--ui-brand); color: white; }
        .button-primary:hover { background: var(--ui-brand-strong); }
        .button-primary:disabled { opacity: .5; cursor: not-allowed; }

        /* New project form */
        .project-form-panel { width: min(100%, 720px); }
        .form-step { margin-bottom: 14px; padding: 15px; border: 1px solid var(--ui-line); border-radius: 13px; background: var(--ui-surface); }
        .form-step.is-muted { background: var(--ui-surface-muted); }
        .form-step-heading { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
        .step-number { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ui-brand-soft); color: var(--ui-brand); font-size: 11px; font-weight: 900; }
        .form-step-heading strong { font-size: 13px; }
        .form-step-heading span:last-child { margin-left: auto; color: var(--ui-subtle); font-size: 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
        .form-grid.is-three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .project-number-inputs { display: grid; grid-template-columns: 82px 1fr; gap: 6px; }
        .add-line-button { width: 100%; min-height: 40px; border: 1px solid color-mix(in srgb, var(--ui-brand) 42%, var(--ui-line)); border-radius: 9px; background: var(--ui-brand-soft); color: var(--ui-brand); font-size: 13px; font-weight: 800; cursor: pointer; }
        .add-line-button:hover { border-color: var(--ui-brand); }
        .project-form-panel .modal-actions {
            position: sticky; bottom: -22px; z-index: 2; margin-right: -22px; margin-left: -22px;
            padding: 13px 22px 22px; border-top: 1px solid var(--ui-line); background: color-mix(in srgb, var(--ui-surface) 96%, transparent);
            backdrop-filter: blur(10px);
        }
        /* Updated-file compatibility: keep the existing form IDs and behavior while modernizing its legacy inline layout. */
        #projectModal .modal-body > div[style*="background:#f8fafc"],
        #projectModal .modal-body > div[style*="border:1px solid #e2e8f0"] {
            padding: 15px !important; border: 1px solid var(--ui-line) !important; border-radius: 13px !important;
            background: var(--ui-surface-muted) !important;
        }
        #projectModal label { color: var(--ui-subtle) !important; font-weight: 700; }
        #projectModal input, #projectModal select {
            border-color: var(--ui-line) !important; border-radius: 9px !important;
            background: var(--ui-surface) !important; color: var(--ui-text) !important;
        }
        #projectModal #pendingTotal { border: 1px solid var(--ui-line); background: var(--ui-surface-muted) !important; }
        .sales-loading-panel { padding: 46px 20px; text-align: center; }
        .sales-loading-spinner { width: 30px; height: 30px; margin: 0 auto 12px; border: 3px solid var(--ui-line); border-top-color: var(--ui-brand); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .sales-filter-bar { display: grid; grid-template-columns: minmax(180px, 1fr) 150px auto auto; align-items: center; gap: 8px; margin-bottom: 14px; padding: 10px; border: 1px solid var(--ui-line); border-radius: 11px; background: var(--ui-surface-muted); }

        .mobile-nav { display: none; }

        @media (max-width: 920px) {
            .global-nav { display: none; }
            .payment-header-row { gap: 10px; }
            .header-status, .header-tool-label { display: none; }
        }
        @media (max-width: 640px) {
            body { padding-bottom: 70px; }
            .payment-header-inner, .payment-main { width: min(100% - 20px, 1400px); }
            .payment-header-inner { padding: 9px 0 8px; }
            .brand-mark { width: 31px; height: 31px; border-radius: 9px; }
            .brand-title { font-size: 14px; }
            .brand-subtitle { display: none; }
            .header-actions { gap: 4px; }
            .shell-icon-button, .shell-tool-button { min-width: 34px; min-height: 34px; padding: 6px 8px; }
            .payment-sync-row { margin-left: 41px; margin-top: 3px; }
            .payment-main { padding-top: 18px; }
            .priority-heading strong { font-size: 16px; }
            .project-workspace { padding: 12px !important; }
            .workspace-tabs { top: 52px !important; margin-left: -12px !important; margin-right: -12px !important; padding-left: 12px !important; padding-right: 12px !important; }
            .workspace-tabs button { flex: 1; min-width: 0; }
            .payment-kpis > div:not(.metrics-heading) { min-height: 82px; }
            .auth-panel { padding: 30px 24px; border-radius: 20px; }
            .summary-grid, .form-grid, .form-grid.is-three, .sales-filter-bar { grid-template-columns: 1fr; }
            .modal-header, .modal-body { padding-left: 16px; padding-right: 16px; }
            .project-form-panel .modal-actions { bottom: -22px; margin-right: -16px; margin-left: -16px; padding-right: 16px; padding-left: 16px; }
            .project-action-button { flex: 1 1 calc(50% - 4px); }
            .mobile-nav {
                position: fixed; left: 10px; right: 10px; bottom: 9px; z-index: 45;
                display: grid; grid-template-columns: repeat(4, 1fr); overflow: hidden;
                border: 1px solid var(--ui-line); border-radius: 16px; background: color-mix(in srgb, var(--ui-surface) 96%, transparent);
                box-shadow: 0 14px 36px rgba(15, 23, 42, .18); backdrop-filter: blur(14px);
            }
            .mobile-nav a { padding: 8px 3px 7px; color: var(--ui-subtle); font-size: 9px; font-weight: 700; text-align: center; text-decoration: none; }
            .mobile-nav a span { display: block; margin-bottom: 1px; font-size: 16px; }
            .mobile-nav a.active { color: var(--ui-brand); background: var(--ui-brand-soft); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-shell">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600 mx-auto mb-4"></div>
                <p class="font-semibold text-slate-800 dark:text-white">支払ナビを準備しています</p>
                <p class="text-slate-500 text-sm mt-1">Google Sheets と接続中...</p>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '47228502594-hk66ecflb2s5iq02rim3o8j0j87d2p3c.apps.googleusercontent.com';
        const SPREADSHEET_ID = '1-Sv1ci9aQ80d5U42lTa2_eWfDCpsp2HESIOpHkOaxQQ';
        const PRODUCT_MASTER_ID = '1YnEJ5LEYBwZJ2zDYnjUpkpjnB2naHFVAtPdzcv81nvI'; // 製品マスタ

        // 営業日計算（日曜と中国祝日を除外）
        function addWorkingDays(startDate, days) {
            let date = new Date(startDate);
            date.setDate(date.getDate() + 1); // 翌日から開始
            let count = 0;
            
            while (count < days) {
                const dayOfWeek = date.getDay();
                const dateStr = date.toISOString().split('T')[0];
                
                // 日曜日(0)と中国祝日を除外
                if (dayOfWeek !== 0 && !chinaHolidays.includes(dateStr)) {
                    count++;
                }
                
                if (count < days) {
                    date.setDate(date.getDate() + 1);
                }
            }
            
            return date;
        }

        // Serial番号を生成
        // projectPrefix/projectNumber が指定された場合、その案件で既に使われている YS 番号と枝番を見て、
        // 同じYS番号の枝番を続ける（例：YS0518-5まで使われてたら YS0518-6 から発行）
        // 案件番号が未指定 or 既存YSが無い場合は、nextSerial から新規発行
        function generateSerial(quantity, projectPrefix, projectNumber) {
            // 既存案件の Serial を調査（projects + 在庫データはここでは projects から）
            let baseSerialNum = null;  // YS番号（例: 518）
            let maxSub = 0;            // その案件で使われた最大枝番

            if (projectPrefix && projectNumber) {
                const normalizedNum = String(projectNumber).replace(/^0+/, ''); // "0518" → "518"
                projects.forEach(p => {
                    if (!p.serial) return;
                    const pNum = String(p.projectNumber || '').replace(/^0+/, '');
                    if ((p.projectPrefix || '').toUpperCase() !== projectPrefix.toUpperCase()) return;
                    if (pNum !== normalizedNum) return;
                    // 該当案件のSerialから YS番号と枝番を抽出
                    // 形式: YS0518, YS0518-5, YS0518(1-5) など
                    const m = p.serial.match(/YS(\d+)(?:-(\d+))?(?:\((\d+)-(\d+)\))?/);
                    if (!m) return;
                    const ysNum = parseInt(m[1], 10);
                    if (baseSerialNum === null) baseSerialNum = ysNum;
                    // 同じ案件で違うYS番号が混じってたら一番大きい方を使う
                    if (ysNum > baseSerialNum) {
                        baseSerialNum = ysNum;
                        maxSub = 0; // YS番号変わったらリセット（保守的）
                    }
                    if (ysNum !== baseSerialNum) return;
                    // 枝番の取得：m[2]=単一枝番、m[4]=(1-N)形式の最大値
                    if (m[2]) {
                        const sub = parseInt(m[2], 10);
                        if (sub > maxSub) maxSub = sub;
                    } else if (m[4]) {
                        const sub = parseInt(m[4], 10);
                        if (sub > maxSub) maxSub = sub;
                    } else {
                        // YS0518 のみ（枝番なし）→ 暗黙の最大は1扱い
                        if (1 > maxSub) maxSub = 1;
                    }
                });
            }

            let serialStr;
            if (baseSerialNum !== null) {
                // 既存案件の続き番号として発行
                serialStr = 'YS' + String(baseSerialNum).padStart(4, '0');
                // maxSub+1 から quantity 個を採番（呼び出し側は serial を baseSerialName として扱い、addToInventoryで枝番展開する）
                // ここでは「枝番の起点」を埋め込んだ表記で返す
                const startSub = maxSub + 1;
                if (quantity <= 1) {
                    return `${serialStr}-${startSub}`;
                } else {
                    return `${serialStr}(${startSub}-${startSub + quantity - 1})`;
                }
            } else {
                // 新規案件 or 既存YSが見つからない → nextSerialから発行
                const serialNum = nextSerial;
                nextSerial++;
                serialStr = 'YS' + String(serialNum).padStart(4, '0');
                if (quantity <= 1) {
                    return serialStr;
                } else {
                    return `${serialStr}(1-${quantity})`;
                }
            }
        }

        // === 認証トークン自動更新（A: 予防型）===
        // Googleアクセストークンは通常1時間で失効する。50分ごとに静かに更新して切れないようにする。
        let tokenRefreshTimer = null;
        let tokenAcquiredAt = 0; // トークン取得時刻（ミリ秒）

        function scheduleTokenRefresh() {
            tokenAcquiredAt = Date.now();
            if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
            tokenRefreshTimer = setTimeout(() => {
                if (!tokenClient) return;
                console.log('[認証] トークンを自動更新します');
                // 静かに更新（ポップアップなし、既存の認可があれば再認証なしで新しいトークンが取れる）
                tokenClient.callback = (resp) => {
                    if (resp.error) {
                        console.warn('[認証] 自動更新失敗:', resp.error);
                        // 失敗してもアプリは止めない。次回の操作で401が出たらリトライで救う
                        return;
                    }
                    accessToken = resp.access_token;
                    sessionStorage.setItem('googleAccessToken', accessToken);
                    gapi.client.setToken({ access_token: accessToken });
                    tokenAcquiredAt = Date.now();
                    console.log('[認証] トークン自動更新 成功');
                    scheduleTokenRefresh(); // 次の更新を予約
                };
                tokenClient.requestAccessToken({ prompt: '' });
            }, 50 * 60 * 1000); // 50分
        }

        // トークンが古くなりすぎてないか確認、必要なら更新（タブ非アクティブで setTimeout が遅延する対策）
        async function ensureFreshToken() {
            // 55分以上経ってたら、操作前に更新を試みる
            if (tokenAcquiredAt > 0 && Date.now() - tokenAcquiredAt > 55 * 60 * 1000) {
                console.log('[認証] トークン期限間近のため事前に更新します');
                try {
                    await refreshTokenSilently();
                } catch (e) {
                    console.warn('[認証] 事前更新失敗、リトライに任せます:', e);
                }
            }
        }

        // === 認証トークン自動リトライ（B: 事後リカバリ）===
        // 401が出たらトークンを取り直してから処理をリトライする。
        // 使い方: await withAuthRetry(() => gapi.client.sheets.spreadsheets.values.get({...}))
        async function withAuthRetry(operation, maxRetries = 1) {
            let lastError;
            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    return await operation();
                } catch (err) {
                    lastError = err;
                    // 401（認証切れ）の判定をゆるく（Google APIのエラー構造が複数あるため）
                    const errStr = JSON.stringify(err || {});
                    const isAuthError = 
                        (err && err.status === 401) ||
                        (err && err.result && err.result.error && err.result.error.code === 401) ||
                        (err && err.result && err.result.error && err.result.error.status === 'UNAUTHENTICATED') ||
                        errStr.includes('"code":401') ||
                        errStr.includes('UNAUTHENTICATED');
                    
                    if (!isAuthError || attempt >= maxRetries) {
                        console.error('[認証] リトライ対象外のエラー、または最大リトライ回数到達:', err);
                        throw err;
                    }
                    console.warn('[認証] 401検出、トークンを再取得してリトライします', err);
                    await refreshTokenSilently();
                }
            }
            throw lastError;
        }

        // トークンを静かに取り直す（Promise化）
        function refreshTokenSilently() {
            return new Promise((resolve, reject) => {
                if (!tokenClient) {
                    reject(new Error('tokenClient未初期化'));
                    return;
                }
                tokenClient.callback = (resp) => {
                    if (resp.error) {
                        reject(new Error(resp.error));
                        return;
                    }
                    accessToken = resp.access_token;
                    sessionStorage.setItem('googleAccessToken', accessToken);
                    gapi.client.setToken({ access_token: accessToken });
                    scheduleTokenRefresh();
                    console.log('[認証] リトライ用トークン取得 成功');
                    resolve();
                };
                tokenClient.requestAccessToken({ prompt: '' });
            });
        }

        async function findFolderUrl(projectNumber) {
            if (folderCache[projectNumber]) {
                return folderCache[projectNumber];
            }
            
            try {
                const response = await gapi.client.drive.files.list({
                    q: `name = '${projectNumber}' and '${PARENT_FOLDER_ID}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`,
                    fields: 'files(id, name, webViewLink)',
                    pageSize: 1,
                    supportsAllDrives: true,
                    includeItemsFromAllDrives: true,
                    corpora: 'allDrives'
                });
                
                const files = response.result.files;
                if (files && files.length > 0) {
                    const url = files[0].webViewLink;
                    folderCache[projectNumber] = url;
                    return url;
                }
                return null;
            } catch (error) {
                console.error('フォルダ検索エラー:', error);

        async function loadData() {
            try {
                showStatus('読み込み中...');
                
                const supplierResponse = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: 'サプライヤー!A2:C',

                suppliers = supplierRows.map((row, idx) => {
                    let paymentPatterns = [{"name":"標準","rates":[50,50]}]; // デフォルト
                    try {

                const projectResponse = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '案件!A2:O',
                });
                const projectRows = projectResponse.result.values || [];
                projects = projectRows.map(row => {
                    // 新形式: ID, 接頭辞, 番号, サプライヤーID, 製品名, 総額USD, デポジット予定, Serial, 数量, WorkingDays, 集荷予定日, 発注日, 諸費用
                    let projectPrefix = row[1] || 'AD';
                    let projectNumber = parseInt(row[2]) || 0;
                    
                    // 古い形式の場合（row[1]が"AD-1234"のような形式）
                    if (row[1] && row[1].match(/^[A-Z]+-\d+$/i)) {
                        const match = row[1].match(/^([A-Z]+)-(\d+)$/i);
                        if (match) {
                            projectPrefix = match[1].toUpperCase();
                            projectNumber = parseInt(match[2]) || 0;
                        }
                    } else if (row[1] && row[1].endsWith('-')) {
                        // ハイフン付きの接頭辞の場合、ハイフンを除去
                        projectPrefix = row[1].slice(0, -1).toUpperCase();
                    }
                    
                    // 新形式かどうかを判定（row[3]がサプライヤーIDっぽいかどうか）
                    const isNewFormat = row[3] && (row[3].length > 10 || !isNaN(parseInt(row[3])));
                    
                    const data = {
                        id: row[0] || String(Date.now()),
                        projectPrefix: projectPrefix,
                        projectNumber: projectNumber,
                        supplierId: parseInt(row[3] || 0),
                        productName: row[4] || '',
                        totalAmount: parseFloat(row[5] || 0),
                        depositSchedule: [],
                        serial: (row[7] && row[7] !== '[]') ? row[7] : '',
                        quantity: parseInt(row[8] || 1),
                        workingDays: parseInt(row[9] || 30),
                        pickupDate: (row[10] && row[10].includes('-')) ? row[10] : '',  // 日付形式のみ
                        registeredDate: row[11] || '',
                        expenses: [],
                        receivedComplete: row[13] === 'true' || row[13] === true,
                        orderBatch: parseInt(row[14]) || 0  // 発注ロット（0=初回, 1=追加1, ...）
                    };
                    
                    // 諸費用をパース
                    try {
                        data.expenses = JSON.parse(row[12] || '[]');
                    } catch (e) {
                        data.expenses = [];
                    }
                    
                    const supplier = suppliers.find(s => s.id === data.supplierId);
                    try {
                        data.depositSchedule = JSON.parse(row[6] || '[]');
                    } catch (e) {
                        if (supplier) {
                            const defaultPattern = supplier.paymentPatterns[0] || {rates: [50, 50]};
                            data.depositSchedule = defaultPattern.rates.map((rate, idx) => ({
                                depositNumber: idx + 1,
                                percentage: rate,
                                amountUSD: (data.totalAmount * rate / 100),
                                paid: false,
                                paidDate: null,
                                exchangeRate: null,
                                amountJPY: null
                            }));
                        }
                    }
                    
                    // nextSerialを更新
                    if (data.serial) {
                        const serialNum = getSerialNumber(data.serial);
                        if (serialNum >= nextSerial) {
                            nextSerial = serialNum + 1;
                        }
                    }
                    
                    return data;
                });

                showStatus('読み込みエラー: ' + err.message);
            }
        }
        
        // 製品マスタを読み込む
        async function loadProductMaster() {
            try {
                productMaster = [];
                
                for (const sheet of PRODUCT_MASTER_SHEETS) {
                    try {
                        const response = await gapi.client.sheets.spreadsheets.values.get({
                            spreadsheetId: PRODUCT_MASTER_ID,  // 製品マスタ
                            range: `${sheet.name}!A1:Z`,
                        });
                        
                        const rows = response.result.values || [];
                        if (rows.length < 2) continue;
                        
                        const headers = rows[0];
                        const pnFullIndex = headers.indexOf('pn_full');
                        const pnIndex = headers.indexOf('pn');
                        const typeIndex = headers.indexOf('type');
                        const categoryIndex = headers.indexOf('category');
                        const supplierIndex = headers.indexOf('supplier');
                        const isActiveIndex = headers.indexOf('is_active');
                        const inchIndex = headers.indexOf('inch');
                        
                        for (let i = 1; i < rows.length; i++) {
                            const row = rows[i];
                            const isActive = isActiveIndex >= 0 ? row[isActiveIndex] : 'TRUE';
                            
                            // is_active が FALSE なら スキップ
                            if (isActive === 'FALSE' || isActive === false) continue;
                            
                            const pnFull = pnFullIndex >= 0 ? row[pnFullIndex] : '';
                            const pn = pnIndex >= 0 ? row[pnIndex] : '';
                            
                            if (!pnFull && !pn) continue;
                            
                            productMaster.push({
                                pn: pn || '',

        // 在庫シートに追加する関数
        async function addToInventory(serial, category, productName, projectNumber, orderDate, quantity, supplierId = '', costPerUnit = '') {
            try {
                // 案件番号を分解
                const parsed = parseProjectNumberString(projectNumber);
                
                // 既存の在庫データを取得
                let existingInventory = [];
                try {
                    const response = await gapi.client.sheets.spreadsheets.values.get({
                        spreadsheetId: SPREADSHEET_ID,
                        range: '在庫!A2:Q',
                    });
                    existingInventory = response.result.values || [];
                } catch (e) {
                    // シートがない場合は新規作成（新形式17列）
                    await gapi.client.sheets.spreadsheets.batchUpdate({
                        spreadsheetId: SPREADSHEET_ID,
                        resource: {
                            requests: [{
                                addSheet: {
                                    properties: { title: '在庫' }
                                }
                            }]
                        }
                    });
                    await gapi.client.sheets.spreadsheets.values.update({
                        spreadsheetId: SPREADSHEET_ID,
                        range: '在庫!A1:Q1',
                        valueInputOption: 'RAW',
                        resource: {
                            values: [['ID', 'Serial', '種別', '製品名', '発注接頭辞', '発注番号', '発注日', '入庫日', 'ステータス', '出庫日', '出庫接頭辞', '出庫番号', '取得金(税別)', '備考', '棚番', '保管場所', 'サプライヤーID']]
                        }
                    });
                }

                // 追加するデータを作成（新形式17列）
                // serial 形式の例:
                //   "YS0518"        → 単品（baseSerial=YS0518, startSub なし）
                //   "YS0518-6"      → 単品で枝番指定（baseSerial=YS0518, startSub=6, quantity=1）
                //   "YS0518(1-5)"   → 複数で起点=1（baseSerial=YS0518, startSub=1, endSub=5）
                //   "YS0518(6-10)"  → 既存案件への追加、枝番起点が6
                let baseSerial = '';
                let startSub = null;
                if (serial) {
                    const rangeMatch = serial.match(/^(YS\d+)\((\d+)-(\d+)\)$/);
                    const subMatch = serial.match(/^(YS\d+)-(\d+)$/);
                    if (rangeMatch) {
                        baseSerial = rangeMatch[1];
                        startSub = parseInt(rangeMatch[2], 10);
                    } else if (subMatch) {
                        baseSerial = subMatch[1];
                        startSub = parseInt(subMatch[2], 10);
                    } else {
                        baseSerial = serial.replace(/\(.*\)/, ''); // YS0554 そのまま
                    }
                }
                const newRows = [];
                
                for (let i = 0; i < quantity; i++) {
                    // Serial が空の場合は空のまま
                    let itemSerial = '';
                    if (baseSerial) {
                        if (startSub !== null) {
                            // 起点付き：startSub, startSub+1, ...
                            itemSerial = `${baseSerial}-${startSub + i}`;
                        } else if (quantity > 1) {
                            // 起点なし複数：1, 2, ...（後方互換）
                            itemSerial = `${baseSerial}-${i + 1}`;
                        } else {
                            // 単品で起点なし
                            itemSerial = baseSerial;
                        }
                    }
                    
                    // ID生成：タイムスタンプ + インデックス + ランダム値で重複を防ぐ
                    const uniqueId = `${Date.now()}-${i + 1}-${Math.random().toString(36).substring(2, 8)}`;
                    newRows.push([
                        uniqueId,                          // ID
                        itemSerial,                        // Serial（空なら空のまま）
                        category,                          // 種別
                        productName,                       // 製品名
                        parsed.prefix,                     // 発注接頭辞
                        padProjectNumber(parsed.number),   // 発注番号（4桁ゼロパディング）
                        orderDate,                         // 発注日
                        '',                                // 入庫日
                        '入庫待ち',                        // ステータス
                        '',                                // 出庫日
                        '',                                // 出庫接頭辞
                        '',                                // 出庫番号
                        costPerUnit,                       // 取得金（単価）
                        '',                                // 備考
                        '',                                // 棚番
                        '',                                // 保管場所
                        supplierId                         // サプライヤーID
                    ]);
                }

                // 在庫シートに追加
                const appendResult = await gapi.client.sheets.spreadsheets.values.append({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A:Q',
                    valueInputOption: 'RAW',
                    insertDataOption: 'INSERT_ROWS',
                    resource: {
                        values: newRows
                    }
                });
                
                console.log(`✅ 在庫シート追加完了: ${quantity}行 (${serial})${costPerUnit ? ' 取得金: ¥' + costPerUnit : ''}`);
                console.log('API応答:', appendResult);
                
                if (!appendResult || !appendResult.result) {
                    console.error('⚠️ API応答が空です');
                }
            } catch (err) {
                console.error('在庫追加エラー:', err);
                console.error('パラメータ:', { serial, category, productName, projectNumber, orderDate, quantity });
                throw err; // エラーを上位に伝播
            }
        }

        // 在庫の取得金を更新
        async function updateInventoryCost(project) {
            try {
                // 認証トークンが古くなりすぎてないかチェックして、必要なら事前に更新
                await ensureFreshToken();

                // 製品代（デポジット合計）
                const depositTotal = project.depositSchedule.reduce((sum, d) => sum + (d.amountJPY || 0), 0);
                
                // 諸費用（原価に含むもののみ）
                const expensesTotal = (project.expenses || [])
                    .filter(e => e.includeInCost !== false && !e.isInventoryItem)  // 付帯品は除外
                    .reduce((sum, e) => sum + (e.amountJPY || 0), 0);
                
                // 取得金合計 = 製品代 + 諸費用（原価）
                const totalCost = depositTotal + expensesTotal;
                
                // 1台あたりの取得金
                const quantity = project.quantity || 1;
                const costPerUnit = Math.round(totalCost / quantity);
                
                if (costPerUnit <= 0) return;
                
                // 在庫シートから該当アイテムを取得（401自動リトライ対応）
                const response = await withAuthRetry(() => gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A2:Q',
                }));
                const rows = response.result.values || [];
                
                // 案件番号が一致する行を探す
                const projectPrefix = project.projectPrefix || 'AD';
                const projectNumber = String(project.projectNumber).padStart(4, '0');
                const productName = project.productName || '';
                const updates = [];

                // デバッグ：探している条件を出力
                console.log('[updateInventoryCost] 探している条件:', {
                    projectPrefix, projectNumber, productName,
                    quantity, costPerUnit, depositTotal, expensesTotal
                });

                // デバッグ：案件番号は一致したが製品名でハジかれた行を記録
                const productNameMismatches = [];

                rows.forEach((row, idx) => {
                    const rowPrefix = row[4] || '';
                    const rowNumber = String(row[5] || '').padStart(4, '0');
                    const rowProductName = row[3] || '';
                    
                    const prefixMatch = rowPrefix.toUpperCase() === projectPrefix.toUpperCase();
                    const numberMatch = rowNumber === projectNumber;
                    // 製品名も一致条件に加える（グループ案件で複数製品が同じ案件番号を持つため）
                    const productMatch = rowProductName === productName;
                    
                    // 案件番号 + 製品名で一致判定
                    if (prefixMatch && numberMatch && productMatch) {
                        const rowNum = idx + 2;
                        // 取得金（M列）のみ更新（製品名は一致条件なので上書き不要）
                        updates.push({
                            range: `在庫!M${rowNum}`,
                            values: [[costPerUnit]]
                        });
                    } else if (prefixMatch && numberMatch && !productMatch) {
                        // 案件番号は合ったが製品名でハジかれた
                        productNameMismatches.push({
                            row: idx + 2,
                            inventoryProductName: rowProductName,
                            expectedProductName: productName
                        });
                    }
                });

                // デバッグ：結果を出力
                console.log('[updateInventoryCost] マッチ結果:', {
                    matched: updates.length,
                    productNameMismatches: productNameMismatches
                });
                if (productNameMismatches.length > 0) {
                    console.warn('[updateInventoryCost] 案件番号は一致したが製品名が違うため除外された行があります:');
                    productNameMismatches.forEach(m => {
                        console.warn(`  在庫行${m.row}: 在庫="${m.inventoryProductName}" / 期待="${m.expectedProductName}"`);
                    });
                }
                
                if (updates.length > 0) {
                    await withAuthRetry(() => gapi.client.sheets.spreadsheets.values.batchUpdate({
                        spreadsheetId: SPREADSHEET_ID,
                        resource: {
                            valueInputOption: 'RAW',
                            data: updates
                        }
                    }));
                    const itemCount = updates.length; // 取得金のみなので1つ＝1台
                    const msg = expensesTotal > 0 
                        ? `✅ 在庫の取得金を更新: ¥${costPerUnit.toLocaleString()}/台 × ${itemCount}台（諸費用¥${expensesTotal.toLocaleString()}含む）`
                        : `✅ 在庫の取得金を更新: ¥${costPerUnit.toLocaleString()}/台 × ${itemCount}台`;
                    showStatus(msg);
                    setTimeout(() => showStatus(''), 3000);
                } else {
                    // 在庫が見つからない場合は新規追加を提案
                    const confirmAdd = confirm(`在庫が見つかりません（${projectPrefix}-${projectNumber}）\n\n新規追加しますか？\n\n製品名: ${productName}\n数量: ${quantity}台\n取得金: ¥${costPerUnit.toLocaleString()}/台`);
                    
                    if (confirmAdd) {
                        try {
                            const serial = project.serial || '';
                            const category = project.category || 'その他';
                            const orderDate = project.registeredDate || new Date().toISOString().split('T')[0];
                            const supplierId = project.supplierId || '';
                            
                            await addToInventory(
                                serial,
                                category,
                                productName,
                                `${projectPrefix}-${projectNumber}`,
                                orderDate,
                                quantity,
                                supplierId,
                                costPerUnit
                            );
                            
                            showStatus(`✅ 在庫に新規追加しました（${quantity}台 × ¥${costPerUnit.toLocaleString()}）`);
                            setTimeout(() => showStatus(''), 3000);
                        } catch (addErr) {
                            console.error('在庫追加エラー:', addErr);
                            showStatus('❌ 在庫の追加に失敗しました', 'error');
                        }
                    } else {
                        showStatus('キャンセルしました');
                        setTimeout(() => showStatus(''), 2000);
                    }
                }
            } catch (e) {
                console.error('在庫取得金の更新に失敗しました:', e);
                showStatus('❌ 在庫取得金の更新に失敗しました', 'error');
            }
        }

        function exportCSV() {
            const headers = ['案件番号', '製品名', 'サプライヤー', '支払回', '支払予定額(USD)', '支払状況', '支払日', '為替レート', '支払額(JPY)'];
            const rows = projects.flatMap(p => {
                const supplier = suppliers.find(s => s.id === p.supplierId);
                return (p.depositSchedule || []).map(dep => [
                    formatProjectNumber(p), 
                    p.productName, 
                    supplier?.name || '', 
                    dep.depositNumber,
                    (dep.amountUSD || 0).toFixed(2),
                    dep.paid ? '完了' : '未払',
                    dep.paidDate || '',
                    dep.exchangeRate || '',
                    dep.amountJPY || ''
                ]);
            });
            const csv = [headers.join(','), ...rows.map(r => r.map(c => `"${c}"`).join(','))].join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `procurement_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        }

        // 案件番号の表示用フォーマット（例: AD-0001）4桁ゼロパディング
        function formatProjectNumber(project) {
            if (!project) return '';
            const prefix = project.projectPrefix || 'AD';
            const number = project.projectNumber || 0;
            // 4桁以下は4桁ゼロパディング、5桁以上はそのまま
            const numStr = String(number);
            const paddedNum = numStr.length <= 4 ? numStr.padStart(4, '0') : numStr;
            return `${prefix}-${paddedNum}`;
        }

        // 案件番号文字列からprefix/numberを分解
        function parseProjectNumberString(str) {
            if (!str) return { prefix: 'AD', number: 0 };
            const match = str.match(/^([A-Z]+)-?(\d+)$/i);
            if (match) {
                return { prefix: match[1].toUpperCase(), number: parseInt(match[2]) };
            }
            // 数字のみの場合
            const numMatch = str.match(/^(\d+)$/);
            if (numMatch) {
                return { prefix: 'AD', number: parseInt(numMatch[1]) };
            }
            return { prefix: 'AD', number: 0 };
        }

        // 番号を4桁ゼロパディング（保存用）
        function padProjectNumber(num) {
            const numStr = String(num || 0);

        // ==================== 販売案件（タブ）関連 ====================
        
        function switchProjectTab(tab) {
            projectTab = tab;
            if (tab === 'sales') {
                loadInventoryForSales();
            } else {
                renderMain();
            }
        }
        
        async function loadInventoryForSales() {
            try {
                showStatus('在庫データを読み込み中...');
                
                // 在庫シートを読み込み
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A2:R',
                });
                const inventoryRows = (response.result.values || []).map(row => ({
                    id: row[0] || '',
                    serial: row[1] || '',
                    category: row[2] || '',
                    productName: row[3] || '',
                    orderPrefix: row[4] || '',
                    orderNumber: row[5] || '',
                    orderDate: row[6] || '',
                    receivedDate: row[7] || '',
                    status: row[8] || '',
                    shipDate: row[9] || '',
                    shipPrefix: row[10] || '',
                    shipNumber: row[11] || '',
                    costJPY: parseFloat(row[12]) || 0,
                    note: row[13] || '',
                    shelfNumber: row[14] || '',
                    location: row[15] || '',
                    supplierId: row[16] || '',
                    isArchived: false
                }));
                
                // アーカイブシートも読み込み
                let archiveRows = [];
                try {
                    const archiveResponse = await gapi.client.sheets.spreadsheets.values.get({
                        spreadsheetId: SPREADSHEET_ID,
                        range: '在庫アーカイブ!A2:R',
                    });
                    archiveRows = (archiveResponse.result.values || []).map(row => ({
                        id: row[0] || '',
                        serial: row[1] || '',
                        category: row[2] || '',
                        productName: row[3] || '',
                        orderPrefix: row[4] || '',
                        orderNumber: row[5] || '',
                        orderDate: row[6] || '',
                        receivedDate: row[7] || '',
                        status: row[8] || '',
                        shipDate: row[9] || '',
                        shipPrefix: row[10] || '',
                        shipNumber: row[11] || '',
                        costJPY: parseFloat(row[12]) || 0,
                        note: row[13] || '',
                        shelfNumber: row[14] || '',
                        location: row[15] || '',
                        supplierId: row[16] || '',
                        isArchived: true
                    }));
                } catch (e) {
                    // アーカイブシートがない場合は空のまま
                    console.log('アーカイブシートなし（またはエラー）:', e);
                }
                
                // 在庫 + アーカイブを結合
                inventoryData = [...inventoryRows, ...archiveRows];
                
                // 販売案件経費も読み込む
                await loadSalesExpenses();
                
                showStatus('');
                renderMain();
            } catch (e) {
                console.error('在庫データ読み込みエラー:', e);
                showStatus('在庫データの読み込みに失敗しました');
            }
        }
        
        async function loadSalesExpenses() {
            try {
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '販売案件経費!A2:G',
                });
                const rows = response.result.values || [];
                salesProjectExpenses = {};
                rows.forEach(row => {
                    const projectNumber = row[0] || '';
                    if (!projectNumber) return;
                    if (!salesProjectExpenses[projectNumber]) {
                        salesProjectExpenses[projectNumber] = [];
                    }
                    salesProjectExpenses[projectNumber].push({
                        id: row[1] || Date.now(),
                        type: row[2] || '',
                        amountJPY: parseFloat(row[3]) || 0,
                        payee: row[4] || '',
                        paidDate: row[5] || '',
                        note: row[6] || ''
                    });
                });
            } catch (e) {
                // シートがない場合は作成
                if (e.result?.error?.code === 400 || e.status === 400) {
                    await createSalesExpensesSheet();
                } else {
                    console.error('販売案件経費読み込みエラー:', e);
                }
            }
        }
        
        async function createSalesExpensesSheet() {
            try {
                await gapi.client.sheets.spreadsheets.batchUpdate({
                    spreadsheetId: SPREADSHEET_ID,
                    resource: {
                        requests: [{
                            addSheet: {
                                properties: { title: '販売案件経費' }
                            }
                        }]
                    }
                });
                await gapi.client.sheets.spreadsheets.values.update({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '販売案件経費!A1:G1',
                    valueInputOption: 'RAW',
                    resource: {
                        values: [['案件番号', 'ID', '種別', '金額', '支払先', '支払日', '備考']]
                    }
                });
                console.log('販売案件経費シートを作成しました');
            } catch (e) {
                console.error('販売案件経費シート作成エラー:', e);
            }
        }
        
        function getSalesProjects() {
            // 出庫先が設定されている在庫をグループ化（引当済 + 出庫済 + アーカイブ済み）
            const allocated = inventoryData.filter(item => 
                item.shipPrefix && item.shipNumber && 
                (item.status === '出庫済' || item.status === '出庫済み' || item.status === '引当済' || item.isArchived)
            );
            
            const grouped = {};
            allocated.forEach(item => {
                const projectNumber = `${item.shipPrefix}-${String(item.shipNumber).padStart(4, '0')}`;
                if (!grouped[projectNumber]) {
                    grouped[projectNumber] = {
                        projectNumber,
                        items: [],
                        expenses: salesProjectExpenses[projectNumber] || [],
                        itemsCost: 0,
                        expensesCost: 0,
                        totalCost: 0,
                        allocatedCount: 0,
                        shippedCount: 0,
                        archivedCount: 0
                    };
                }
                grouped[projectNumber].items.push({
                    ...item,
                    orderProject: item.orderPrefix && item.orderNumber 
                        ? `${item.orderPrefix}-${String(item.orderNumber).padStart(4, '0')}`
                        : ''
                });
                grouped[projectNumber].itemsCost += item.costJPY || 0;
                if (item.isArchived) {
                    grouped[projectNumber].archivedCount++;
                } else if (item.status === '引当済') {
                    grouped[projectNumber].allocatedCount++;
                } else {
                    grouped[projectNumber].shippedCount++;
                }
            });
            
            // 経費を合計
            Object.values(grouped).forEach(sp => {
                sp.expensesCost = sp.expenses.reduce((sum, e) => sum + (e.amountJPY || 0), 0);
                sp.totalCost = sp.itemsCost + sp.expensesCost;
            });
            
            return Object.values(grouped).sort((a, b) => b.projectNumber.localeCompare(a.projectNumber));
        }
        
        function toggleSalesProject(projectNumber) {
            expandedSalesProjects[projectNumber] = !expandedSalesProjects[projectNumber];
            renderMain();
        }
        
        async function refreshSalesProjects() {
            await loadInventoryForSales();
        }

        async function submitSalesExpense(projectNumber) {
            const type = document.getElementById('salesExpenseType').value;
            const amount = parseFloat(document.getElementById('salesExpenseAmount').value);
            const payee = document.getElementById('salesExpensePayee').value.trim();
            const paidDate = document.getElementById('salesExpensePaidDate').value;
            const note = document.getElementById('salesExpenseNote').value.trim();
            
            if (!amount || amount <= 0) {
                alert('金額を入力してください');
                return;
            }
            
            const id = Date.now();
            
            try {
                // スプレッドシートに追加
                await gapi.client.sheets.spreadsheets.values.append({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '販売案件経費!A:G',
                    valueInputOption: 'RAW',
                    resource: {
                        values: [[projectNumber, id, type, amount, payee, paidDate, note]]
                    }
                });
                
                // ローカルデータも更新
                if (!salesProjectExpenses[projectNumber]) {
                    salesProjectExpenses[projectNumber] = [];
                }
                salesProjectExpenses[projectNumber].push({
                    id, type, amountJPY: amount, payee, paidDate, note
                });
                
                closeModal('salesExpenseModal');
                renderMain();
                showStatus('✅ 経費を追加しました');
                setTimeout(() => showStatus(''), 3000);
            } catch (e) {
                console.error('経費追加エラー:', e);
                alert('経費の追加に失敗しました');
            }
        }
        
        async function deleteSalesExpense(projectNumber, expenseIndex) {
            const expenses = salesProjectExpenses[projectNumber];
            if (!expenses || !expenses[expenseIndex]) return;
            
            const expense = expenses[expenseIndex];
            if (!confirm(`「${expense.type}」(${formatJPY(expense.amountJPY)}) を削除しますか？`)) return;
            
            try {
                // スプレッドシートから該当行を探して削除
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '販売案件経費!A2:G',
                });
                const rows = response.result.values || [];
                
                let rowToDelete = -1;
                rows.forEach((row, idx) => {
                    if (row[0] === projectNumber && row[1] === String(expense.id)) {
                        rowToDelete = idx + 2; // ヘッダー行を考慮
                    }
                });
                
                if (rowToDelete > 0) {
                    const sheetMeta = await gapi.client.sheets.spreadsheets.get({
                        spreadsheetId: SPREADSHEET_ID,
                    });
                    const sheet = sheetMeta.result.sheets.find(s => s.properties.title === '販売案件経費');
                    
                    if (sheet) {
                        await gapi.client.sheets.spreadsheets.batchUpdate({
                            spreadsheetId: SPREADSHEET_ID,
                            resource: {
                                requests: [{
                                    deleteDimension: {
                                        range: {
                                            sheetId: sheet.properties.sheetId,
                                            dimension: 'ROWS',
                                            startIndex: rowToDelete - 1,
                                            endIndex: rowToDelete
                                        }
                                    }
                                }]
                            }
                        });
                    }
                }
                
                // ローカルデータからも削除
                expenses.splice(expenseIndex, 1);
                
                renderMain();
                showStatus('✅ 経費を削除しました');
                setTimeout(() => showStatus(''), 3000);
            } catch (e) {
                console.error('経費削除エラー:', e);
                alert('経費の削除に失敗しました');
            }
        }

        async function getExchangeRate(date) {
            try {
                // Frankfurter APIで過去日のレートを取得
                const dateStr = new Date(date).toISOString().split('T')[0];
                const response = await fetch(`https://api.frankfurter.app/${dateStr}?from=USD&to=JPY`);
                const data = await response.json();
                return data.rates.JPY;
            } catch (error) {
                console.error('為替レート取得エラー:', error);
                // フォールバック: 最新レートを取得
                try {
                    const fallbackResponse = await fetch('https://api.frankfurter.app/latest?from=USD&to=JPY');
                    const fallbackData = await fallbackResponse.json();
                    return fallbackData.rates.JPY;
                } catch (e) {
                    return null;
                }
            }
        }

            showStatus('為替レート取得中...');
            const autoRate = await getExchangeRate(paidDate);
            
            let exchangeRate;
            if (autoRate) {
                const useAutoRate = confirm(`${paidDate}のレート: ¥${autoRate.toFixed(2)}\n\nこのレートを使用しますか？\n（キャンセルすると手動入力になります）`);
                if (useAutoRate) {
                    exchangeRate = autoRate;
                } else {
                    exchangeRate = parseFloat(prompt('為替レート (JPY/USD):', autoRate.toFixed(2)));
                }
            } else {
                exchangeRate = parseFloat(prompt('為替レート (JPY/USD):'));
            }
            
            if (!exchangeRate) return;
            
            await markPaymentPaid(projectId, depositNumber, paidDate, exchangeRate);
            renderMain();
        }

        // グループの為替レート編集
        async function editGroupPaymentRate(projectNumber, depositNumber, orderBatch = 0) {
            const groupProjects = projects.filter(p =>
                formatProjectNumber(p) === projectNumber && (p.orderBatch || 0) === orderBatch
            );
            const representative = groupProjects[0];
            
            if (!representative) return;
            
            const dep = (representative.depositSchedule || []).find(d => d.depositNumber === depositNumber);
            if (!dep) return;
            
            const newRate = parseFloat(prompt(`${depositLabel({ depositNumber, orderBatch })}の為替レートを修正:`, dep.exchangeRate || ''));
            if (!newRate) return;
            
            // 全製品に適用
            for (const p of groupProjects) {
                const pDep = (p.depositSchedule || []).find(d => d.depositNumber === depositNumber);
                if (pDep) {
                    pDep.exchangeRate = newRate;
                    pDep.amountJPY = Math.round((pDep.amountUSD || 0) * newRate);
                }
            }
            
            saveData();
            renderMain();
            showStatus(`✅ ${groupProjects.length}製品のレートを更新しました`);
            setTimeout(() => showStatus(''), 3000);
        }

        function editSupplier(supplierId) {
            const supplier = suppliers.find(s => s.id === supplierId);
            if (!supplier) return;
            
            const name = prompt('サプライヤー名:', supplier.name);
            if (!name) return;
            
            // 既存パターンを表示
            const existingPatterns = (supplier.paymentPatterns || []).map((p, idx) => 
                `${idx + 1}. ${p.name}: ${p.rates.join('→')}%`
            ).join('\n');
            
            const action = prompt(`現在の支払いパターン:\n${existingPatterns}\n\n操作を選択:\n1: パターン追加\n2: パターン削除\n3: 名前変更のみ\n\n番号を入力:`, '3');
            
            if (action === '1') {
                // パターン追加
                const patternName = prompt('新しい支払いパターン名:', '');
                if (!patternName) return;
                
                const count = parseInt(prompt(`「${patternName}」のデポジット回数:`, '1'));
                if (!count || count < 1) return;
                
                const rates = [];
                let total = 0;
                
                for (let i = 0; i < count; i++) {
                    const rate = parseFloat(prompt(`第${i + 1}回目のデポジット割合 (%):\n残り: ${100 - total}%`, count === 1 ? '100' : ''));
                    if (rate === null || rate === '' || isNaN(rate)) return;
                    rates.push(rate);
                    total += rate;
                }
                
                if (Math.abs(total - 100) > 0.01) {
                    alert(`エラー: 合計が${total}%です。100%になるように入力してください。`);
                    return;
                }
                
                supplier.paymentPatterns.push({ name: patternName, rates });
            } else if (action === '2') {
                // パターン削除
                if (supplier.paymentPatterns.length <= 1) {
                    alert('最低1つのパターンが必要です');
                    return;
                }
                const delIdx = parseInt(prompt('削除するパターン番号:', '')) - 1;
                if (delIdx >= 0 && delIdx < supplier.paymentPatterns.length) {
                    supplier.paymentPatterns.splice(delIdx, 1);
                }
            }
            
            supplier.name = name;

            saveData();
            renderMain();
        }

        function deleteSupplier(supplierId) {
            const supplier = suppliers.find(s => s.id === supplierId);
            if (!supplier) return;
            
            // 関連する案件があるか確認
            const relatedProjects = projects.filter(p => p.supplierId === supplierId);
            if (relatedProjects.length > 0) {
                alert(`エラー: このサプライヤーには${relatedProjects.length}件の案件が紐付いています。\n先に案件を削除してください。`);
                return;
            }
            
            if (!confirm(`「${supplier.name}」を削除しますか？`)) return;
            
            suppliers = suppliers.filter(s => s.id !== supplierId);
            saveData();
            renderMain();
        }

        // 在庫に送る機能
        async function sendToInventory(projectId) {
            const project = projects.find(p => String(p.id) === String(projectId));
            if (!project) return;

            // 種別を選択
            const categories = [
                'マルチディスプレイ',
                '屋外',
                '屋内',
                '電子黒板',
                'マトリクス',
                'メディアプレーヤー',
                'スタンド/金具',
                '周辺機器'
            ];

            const categoryIndex = prompt(
                `種別を選択してください（番号入力）:\n\n` +
                categories.map((c, i) => `${i + 1}. ${c}`).join('\n') +
                `\n\n案件: ${formatProjectNumber(project)}\n製品: ${project.productName}\n数量: ${project.quantity || 1}台`
            );
            
            if (!categoryIndex) return;
            const category = categories[parseInt(categoryIndex) - 1];
            if (!category) {
                alert('正しい番号を入力してください');
                return;
            }

            const quantity = project.quantity || 1;
            const serial = project.serial || '';

            // 在庫シートに追加
            try {
                showStatus('在庫シートに追加中...');

                // 既存の在庫データを取得
                let existingInventory = [];
                try {
                    const response = await gapi.client.sheets.spreadsheets.values.get({
                        spreadsheetId: SPREADSHEET_ID,
                        range: '在庫!A2:Q',
                    });
                    existingInventory = response.result.values || [];
                } catch (e) {
                    // シートがない場合は新規作成（新形式17列）
                    await gapi.client.sheets.spreadsheets.batchUpdate({
                        spreadsheetId: SPREADSHEET_ID,
                        resource: {
                            requests: [{
                                addSheet: {
                                    properties: { title: '在庫' }
                                }
                            }]
                        }
                    });
                    await gapi.client.sheets.spreadsheets.values.update({
                        spreadsheetId: SPREADSHEET_ID,
                        range: '在庫!A1:Q1',
                        valueInputOption: 'RAW',
                        resource: {
                            values: [['ID', 'Serial', '種別', '製品名', '発注接頭辞', '発注番号', '発注日', '入庫日', 'ステータス', '出庫日', '出庫接頭辞', '出庫番号', '取得金(税別)', '備考', '棚番', '保管場所', 'サプライヤーID']]
                        }
                    });
                }

                // 重複チェック（Serial空の場合はスキップ）
                const existingSerials = existingInventory.map(row => row[1]);
                const baseSerial = serial ? serial.replace(/\(.*\)/, '') : ''; // YS0554(1-4) → YS0554
                
                // 追加するデータを作成（新形式17列）
                const newRows = [];
                const today = new Date().toISOString().split('T')[0];
                
                for (let i = 1; i <= quantity; i++) {
                    const itemSerial = baseSerial ? (quantity > 1 ? `${baseSerial}-${i}` : baseSerial) : '';
                    
                    // 既に存在するかチェック（Serial空の場合はスキップしない）
                    if (itemSerial && existingSerials.includes(itemSerial)) {
                        continue; // スキップ
                    }
                    
                    newRows.push([
                        Date.now().toString() + '-' + i,  // ID
                        itemSerial,                        // Serial
                        category,                          // 種別
                        project.productName,               // 製品名
                        project.projectPrefix || 'AD',     // 発注接頭辞
                        padProjectNumber(project.projectNumber), // 発注番号（4桁ゼロパディング）
                        today,                             // 発注日
                        '',                                // 入庫日
                        '入庫待ち',                        // ステータス
                        '',                                // 出庫日
                        '',                                // 出庫接頭辞
                        '',                                // 出庫番号
                        '',                                // 取得金
                        '',                                // 備考
                        '',                                // 棚番
                        '',                                // 保管場所
                        project.supplierId || ''           // サプライヤーID
                    ]);
                }

                if (newRows.length === 0) {
                    alert('すべてのSerialが既に在庫に登録されています。');
                    showStatus('');
                    return;
                }

                // 在庫シートに追加
                await gapi.client.sheets.spreadsheets.values.append({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A:Q',
                    valueInputOption: 'RAW',
                    insertDataOption: 'INSERT_ROWS',
                    resource: {
                        values: newRows
                    }
                });

                showStatus('');
                alert(`在庫に${newRows.length}件追加しました！\n\n在庫管理システムで「入庫」処理を行ってください。`);
                
            } catch (err) {
                console.error('在庫追加エラー:', err);
                showStatus('');
                alert('エラー: ' + err.message);
            }
        }

        // 製品を一時リストに追加
        function addPendingItem() {
            const category = document.getElementById('modalCategory').value;
            const productName = document.getElementById('modalProductName').value.trim();
            const quantity = parseInt(document.getElementById('modalQuantity').value) || 1;
            const totalAmount = parseFloat(document.getElementById('modalTotalAmount').value) || 0;

                alert('種別を選択してください');
                return;
            }
            if (!productName) {

                return;
            }
            if (totalAmount <= 0) {
                alert('金額を入力してください');

            pendingItems.push({
                category,

                totalAmount
