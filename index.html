        // サプライヤー・種別で製品リストをフィルタ
        function filterProductList() {
            const searchText = document.getElementById('modalProductSearch')?.value || '';
            const supplierId = document.getElementById('modalSupplierId')?.value;
            const category = document.getElementById('modalCategory')?.value;
            const select = document.getElementById('modalProductSelect');
            
            if (!select) return;
            
            console.log('filterProductList called:', { productMasterCount: productMaster.length, supplierId, category, searchText });
            
            const search = searchText.toLowerCase();
            
            // サプライヤー名を取得
            const supplier = suppliers.find(s => s.id === parseInt(supplierId));
            const supplierName = supplier?.name?.toLowerCase() || '';
            
            // カテゴリマッピング（選択肢 → マスタの値）
            const categoryMap = {
                '屋内': ['屋内'],
                '屋外': ['屋外'],
                'マルチディスプレイ': ['マルチディスプレイ'],
                'LEDビジョン': ['屋外LED', '屋内LED', 'LEDビジョン'],
                'STUDIA': ['STUDIA'],
                'マトリクス': ['マトリクス'],
                'OPS': ['OPS'],
                'メディアプレーヤー': ['メディアプレーヤー'],
                'スタンド/金具': ['スタンド/金具'],
                '周辺機器': ['周辺機器', 'LEDコントローラー']
            };
            const matchCategories = category ? (categoryMap[category] || [category]) : [];
            
            let filtered = productMaster.filter(p => {
                // サプライヤーフィルタ（選択されている場合のみ）
                if (supplierId && supplierName) {
                    const pSupplier = p.supplier.toLowerCase();
                    if (!pSupplier.includes(supplierName) && !supplierName.includes(pSupplier)) {
                        return false;
                    }
                }
                
                // 種別フィルタ（選択されている場合のみ）
                if (category && matchCategories.length > 0) {
                    const pCategory = p.category || '';
                    const matched = matchCategories.some(c => pCategory === c);
                    if (!matched) {
                        return false;
                    }
                }
                
                // テキスト検索
                if (search) {
                    if (!p.pnFull.toLowerCase().includes(search) && 
                        !p.pn.toLowerCase().includes(search)) {
                        return false;
                    }
                }
                
                return true;
            });
            
            console.log('filtered count:', filtered.length);
            
            // フィルタ後の件数を保持（表示制限の前に）
            const filteredTotalCount = filtered.length;
            
            // 最大200件まで表示（以前は50件だったが、屋外などで67件以上あるケースのため拡大）
            filtered = filtered.slice(0, 200);
            
            select.innerHTML = '<option value="">-- 型式を選択 --</option>' + 
                filtered.map(p => 
                    `<option value="${p.pnFull}">${p.pnFull}</option>`
                ).join('');
            
            // 件数表示を更新
            const countEl = document.getElementById('productMasterCount');
            if (countEl) {
                if (productMaster.length === 0) {
                    countEl.textContent = '製品マスタを読み込み中...';
                } else if (filteredTotalCount > filtered.length) {
                    // 200件超過時のみ「表示N / 該当M / 全L」を表示
                    countEl.textContent = `${filtered.length}件表示（該当${filteredTotalCount}件 / 全${productMaster.length}件）`;
                } else {
                    // 通常は「該当N件 / 全M件」を表示
                    countEl.textContent = `${filtered.length}件（全${productMaster.length}件中）`;
                }
            }
        }

        async function submitProjectForm() {
            const projectPrefix = document.getElementById('modalProjectPrefix').value;
            const projectNumber = document.getElementById('modalProjectNumber').value.trim();
            const supplierId = document.getElementById('modalSupplierId').value;
            const workingDays = parseInt(document.getElementById('modalWorkingDays').value) || 30;
            const patternIndex = parseInt(document.getElementById('modalPaymentPattern').value) || 0;
            
            if (!projectNumber) {
                alert('案件番号を入力してください');
                return;
            }
            if (!supplierId) {
                alert('サプライヤーを選択してください');
                return;
            }
            if (pendingItems.length === 0) {
                alert('製品を追加してください');
                return;
            }
            
            showStatus(`登録中... (0/${pendingItems.length})`);
            
            // 接頭辞と番号を結合
            const projectNumberFull = `${projectPrefix}-${projectNumber}`;

            // 既存案件番号なら「追加発注」として別ロットで登録（支払いを初回と分ける）
            const parsedForBatch = parseProjectNumberString(projectNumberFull);
            const orderBatch = getNextOrderBatch(parsedForBatch.prefix, parsedForBatch.number);
            if (orderBatch > 0) {
                const ok = confirm(
                    `${projectNumberFull} はすでに登録されています。\n\n` +
                    `「追加${orderBatch}」として、初回とは別の支払予定で登録しますか？\n` +
                    `（今までの支払い記録はそのまま残ります）`
                );
                if (!ok) {
                    showStatus('');
                    return;
                }
            }
            
            // 各製品を順番に登録
            for (let i = 0; i < pendingItems.length; i++) {
                const item = pendingItems[i];
                showStatus(`登録中... (${i + 1}/${pendingItems.length})`);
                await addProject(
                    projectNumberFull, 
                    supplierId, 
                    item.productName, 
                    item.totalAmount, 
                    item.quantity, 
                    workingDays, 
                    item.category,
                    patternIndex,
                    orderBatch
                );
            }
            
            closeProjectModal();
            showStatus(`${pendingItems.length}件の製品を登録しました`);
            setTimeout(() => showStatus(''), 3000);
            renderMain();
        }

        // インボイス用テキスト生成（単一）
        function generateInvoiceText(project) {
            const pickupDateDisplay = project.pickupDate ? project.pickupDate.replace(/-/g, '/') : '未設定';
            
            let text = `PJ番号：${formatProjectNumber(project)}\n`;
            text += `Serial：${project.serial || 'none'}\n`;
            text += `集荷予定日：${pickupDateDisplay}\n\n`;
            
            project.depositSchedule.forEach(dep => {
                text += `${dep.percentage}%  $${dep.amountUSD.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
            });
            
            return text.trim();
        }

        // グループ用シリアルフォーマット
        function formatGroupSerials(items) {
            // シリアルを抽出（空を除く）
            const serials = items.map(p => p.serial).filter(s => s && s.trim());
            
            if (serials.length === 0) return 'none';
            if (serials.length === 1) return serials[0];
            
            // ソート
            serials.sort();
            
            // 連番チェック（YS0001, YS0002... のパターン）
            const pattern = /^([A-Za-z]+)(\d+)$/;
            const parsed = serials.map(s => {
                const match = s.match(pattern);
                if (match) {
                    return { original: s, prefix: match[1], num: parseInt(match[2]) };
                }
                return null;
            });
            
            // 全て同じプレフィックスで連番なら範囲表示
            if (parsed.every(p => p !== null)) {
                const prefixes = [...new Set(parsed.map(p => p.prefix))];
                if (prefixes.length === 1) {
                    const nums = parsed.map(p => p.num).sort((a, b) => a - b);
                    const minNum = nums[0];
                    const maxNum = nums[nums.length - 1];
                    
                    // 連続してるかチェック
                    const isConsecutive = (maxNum - minNum + 1) === nums.length;
                    
                    if (isConsecutive && nums.length > 1) {
                        // 連番: YS0001～YS0005
                        const prefix = prefixes[0];
                        const padLen = parsed[0].original.length - prefix.length;
                        const minStr = String(minNum).padStart(padLen, '0');
                        const maxStr = String(maxNum).padStart(padLen, '0');
                        return `${prefix}${minStr}～${prefix}${maxStr}`;
                    }
                }
            }
            
            // 枝番パターンチェック（YS0001-1, YS0001-2... のパターン）
            const branchPattern = /^(.+)-(\d+)$/;
            const branchParsed = serials.map(s => {
                const match = s.match(branchPattern);
                if (match) {
                    return { original: s, base: match[1], branch: parseInt(match[2]) };
                }
                return null;
            });
            
            if (branchParsed.every(p => p !== null)) {
                const bases = [...new Set(branchParsed.map(p => p.base))];
                if (bases.length === 1) {
                    const branches = branchParsed.map(p => p.branch).sort((a, b) => a - b);
                    const minBranch = branches[0];
                    const maxBranch = branches[branches.length - 1];
                    return `${bases[0]}（${minBranch}～${maxBranch}）`;
                }
            }
            
            // どのパターンにも当てはまらない場合はカンマ区切り
            return serials.join(', ');
        }

        // インボイステキスト生成（発注ロット単位。サプライヤーのPI 1枚 = ロット1つ）
        // lot を省略すると案件内の全製品（ロットが1つの案件は従来どおり）
        function generateGroupInvoiceText(projectNumber, lot = null) {
            let groupProjects = projects.filter(p => formatProjectNumber(p) === projectNumber);
            if (lot !== null) {
                groupProjects = groupProjects.filter(p => (p.orderBatch || 0) === lot);
            }
            if (groupProjects.length === 0) return '';
            
            const representative = groupProjects[0];
            const pickupDateDisplay = representative.pickupDate ? representative.pickupDate.replace(/-/g, '/') : '未設定';
            const serialDisplay = formatGroupSerials(groupProjects);
            const lotSuffix = lot !== null && lot > 0 ? `（追加${lot}）` : '';
            
            let text = `PJ番号：${projectNumber}${lotSuffix}\n`;
            text += `Serial：${serialDisplay}\n`;
            text += `集荷予定日：${pickupDateDisplay}\n\n`;
            
            // デポジット：対象製品すべての同じ回を合算（以前は先頭の製品1つ分しか出ていなかった）
            const byNumber = {};
            groupProjects.forEach(p => {
                (p.depositSchedule || []).forEach(dep => {
                    if (!byNumber[dep.depositNumber]) {
                        byNumber[dep.depositNumber] = { percentage: dep.percentage, amountUSD: 0, paid: dep.paid };
                    }
                    byNumber[dep.depositNumber].amountUSD += dep.amountUSD || 0;
                    if (dep.paid) byNumber[dep.depositNumber].paid = true;
                });
            });
            Object.keys(byNumber).map(Number).sort((x, y) => x - y).forEach(n => {
                const dep = byNumber[n];
                const status = dep.paid ? '✓済' : '未';
                text += `${dep.percentage}%  $${dep.amountUSD.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} [${status}]\n`;
            });
            
            return text.trim();
        }

        // クリップボードへコピー（共通）
        function copyTextToClipboard(text) {
            const done = () => {
                showStatus('📋 インボイス情報をコピーしました！');
                setTimeout(() => showStatus(''), 2000);
            };
            navigator.clipboard.writeText(text).then(done).catch(err => {
                console.error('コピーエラー:', err);
                // フォールバック：テキストエリアを使う方法
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                done();
            });
        }

        // グループ用クリップボードコピー
        // 発注ロットが複数ある案件は、どのロット（PI）をコピーするか選ぶ
        function copyGroupInvoiceText(projectNumber) {
            const groupProjects = projects.filter(p => formatProjectNumber(p) === projectNumber);
            if (groupProjects.length === 0) {
                showStatus('コピーするデータがありません', 'error');
                return;
            }
            const lots = [...new Set(groupProjects.map(p => p.orderBatch || 0))].sort((x, y) => x - y);
            
            if (lots.length === 1) {
                copyTextToClipboard(generateGroupInvoiceText(projectNumber, lots[0]));
                return;
            }
            
            // ロット選択（最新ロットを上に）
            const existing = document.getElementById('invoiceLotModal');
            if (existing) existing.remove();
            const latest = lots[lots.length - 1];
            const modal = document.createElement('div');
            modal.id = 'invoiceLotModal';
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onclick="if(event.target===this) closeModal('invoiceLotModal')">
                    <div class="bg-white dark:bg-slate-800 rounded-xl p-5 w-full max-w-sm">
                        <h3 class="text-lg font-bold mb-1 dark:text-white">📋 インボイス情報をコピー</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">${projectNumber} のどの発注分をコピーしますか？</p>
                        <div class="space-y-2">
                            ${[...lots].reverse().map(b => {
                                const items = groupProjects.filter(p => (p.orderBatch || 0) === b);
                                const usd = items.reduce((sum, p) => sum + (p.totalAmount || 0), 0);
                                const names = items.map(p => p.productName).join(', ');
                                return `
                                    <button onclick="copyTextToClipboard(generateGroupInvoiceText('${projectNumber}', ${b})); closeModal('invoiceLotModal')"
                                        class="w-full text-left px-3 py-2 rounded-lg border ${b === latest ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/30' : 'border-slate-200 dark:border-slate-600'} hover:bg-slate-50 dark:hover:bg-slate-700">
                                        <div class="flex justify-between items-center">
                                            <span class="font-semibold text-sm dark:text-white">${b > 0 ? `追加${b}` : '初回'}${b === latest ? '（最新）' : ''}</span>
                                            <span class="text-sm text-slate-600 dark:text-slate-300">$${usd.toLocaleString()}</span>
                                        </div>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${escapeHtml(names)}</p>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        <button onclick="closeModal('invoiceLotModal')" class="mt-4 w-full px-3 py-2 text-sm text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-lg">キャンセル</button>
                    </div>
                </div>
            `;

        // グループ編集モーダルから製品を削除
        async function removeGroupProduct(idx, projectId) {
            const project = projects.find(p => String(p.id) === String(projectId));
            if (!project) return;
            
            const productName = project.productName || '(製品名なし)';
            if (!confirm(`「${productName}」を削除しますか？\n\n※この操作は保存後に反映されます`)) {
                return;
            }
            
            // プロジェクトを削除
            projects = projects.filter(p => String(p.id) !== String(projectId));
            
            // UIから該当アイテムを非表示
            const itemEl = document.getElementById(`groupProductItem_${idx}`);
            if (itemEl) {
                itemEl.style.display = 'none';
            }
            
            // 合計を更新
            updateGroupTotal();
            
            // データを保存
            await saveData();
            
            showStatus('✅ 製品を削除しました');
            setTimeout(() => showStatus(''), 2000);
        }
        
        // グループ編集モーダルに製品を追加

            const parsed = parseProjectNumberString(projectNumber);
            
            // 既存のグループから共通設定を取得
            const existingProjects = projects.filter(p => formatProjectNumber(p) === projectNumber);

            // 新しい製品を作成
            const newProject = {
                id: Date.now(),
                projectPrefix: parsed.prefix,
                projectNumber: parsed.number,
                productName: '',
                quantity: 1,
                serial: '',
                totalAmount: 0,
                supplierId: representative.supplierId || null,
                registeredDate: representative.registeredDate || new Date().toISOString().split('T')[0],
                pickupDate: representative.pickupDate || '',
                workingDays: representative.workingDays || 30,
                status: representative.status || '発注済',
                depositSchedule: [],
                // グループ編集から足した製品は、いちばん新しい発注ロットに入れる
                orderBatch: existingProjects.length > 0 ? Math.max(...existingProjects.map(p => p.orderBatch || 0)) : 0
            };

            projects.push(newProject);

        // グループの製品を在庫シートに追加
        async function addGroupToInventory(projectNumber) {
            const groupProjects = projects.filter(p => formatProjectNumber(p) === projectNumber);
            if (groupProjects.length === 0) return;
            
            // モーダルから最新の値を取得
            const supplierId = document.getElementById('editGroupSupplierId').value || '';
            const orderDate = document.getElementById('editGroupOrderDate').value || new Date().toISOString().split('T')[0];
            
            let addedCount = 0;
            
            for (let idx = 0; idx < groupProjects.length; idx++) {
                const p = groupProjects[idx];
                
                // モーダルの入力値を取得
                const qtyInput = document.getElementById(`editProductQty_${idx}`);
                const serialInput = document.getElementById(`editProductSerial_${idx}`);
                const nameInput = document.getElementById(`editProductName_${idx}`);
                
                const quantity = qtyInput ? parseInt(qtyInput.value) || 1 : (p.quantity || 1);
                const grpParsed = parseProjectNumberString(projectNumber);
                const serial = serialInput ? serialInput.value.trim() : (p.serial || generateSerial(quantity, grpParsed.prefix, grpParsed.number));
                const productName = nameInput ? nameInput.value.trim() : p.productName;
                const category = detectCategory(productName) || 'その他';
                
                try {
                    await addToInventory(serial, category, productName, projectNumber, orderDate, quantity, supplierId);
                    addedCount += quantity;
                    console.log(`✅ 在庫追加: ${productName} x ${quantity}`);
                } catch (err) {
                    console.error(`在庫追加エラー: ${productName}`, err);
                }
            }
            
            showStatus(`✅ 在庫シートに${addedCount}件追加しました`);
            setTimeout(() => showStatus(''), 3000);
        }
        
        // 数量比で按分
        function distributeByQuantity() {
            const totalUSD = parseFloat(document.getElementById('editGroupTotalUSD').value) || 0;
            
            // 各製品の数量を取得
            const productInputs = document.querySelectorAll('[id^="editProductUSD_"]');
            let totalQuantity = 0;
            const quantities = [];
            
            productInputs.forEach((input, idx) => {
                const projectId = input.dataset.projectId;
                const project = projects.find(p => String(p.id) === String(projectId));
                const qty = project ? (project.quantity || 1) : 1;
                quantities.push(qty);
                totalQuantity += qty;
            });
            
            // 按分して設定
            let remaining = totalUSD;
            productInputs.forEach((input, idx) => {
                if (idx === productInputs.length - 1) {
                    // 最後は端数調整
                    input.value = remaining.toFixed(2);
                } else {
                    const amount = Math.round(totalUSD * quantities[idx] / totalQuantity * 100) / 100;
                    input.value = amount.toFixed(2);
                    remaining -= amount;
                }
            });
            
            updateGroupTotal();
        }
        
        // 製品小計を更新
        function updateGroupTotal() {
            const productInputs = document.querySelectorAll('[id^="editProductUSD_"]');
            let subtotal = 0;
            productInputs.forEach(input => {
                // 親要素が非表示の場合はスキップ
                const parentItem = input.closest('[id^="groupProductItem_"]');
                if (parentItem && parentItem.style.display === 'none') return;
                subtotal += parseFloat(input.value) || 0;
            });
            
            const subtotalEl = document.getElementById('groupProductSubtotal');
            if (subtotalEl) {
                subtotalEl.textContent = '$' + subtotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            }
            
            // デポジットプレビューも更新
            updateGroupDepositPreview();
        }
        
        // サプライヤー変更時にパターン選択肢を更新
        function updateGroupDepositPattern() {
            const supplierId = parseInt(document.getElementById('editGroupSupplierId').value);
            const supplier = suppliers.find(s => s.id === supplierId);
            const patternSelect = document.getElementById('editGroupDepositPattern');
            
            if (!supplier || !patternSelect) return;
            
            patternSelect.innerHTML = '<option value="">-- 選択 --</option>' +
                supplier.paymentPatterns.map((pat, idx) => `
                    <option value="${idx}">${pat.name}: ${pat.rates.join('→')}%</option>
                `).join('');
        }
        
        // パターン選択時にプレビュー更新
        function applyGroupDepositPattern() {
            updateGroupDepositPreview();
        }
        
        function updateGroupDepositPreview() {
            const supplierId = parseInt(document.getElementById('editGroupSupplierId').value);
            const patternIdx = document.getElementById('editGroupDepositPattern').value;
            const supplier = suppliers.find(s => s.id === supplierId);
            const previewEl = document.getElementById('groupDepositPreview');
            
            if (!previewEl) return;
            
            // 製品小計を計算
            const productInputs = document.querySelectorAll('[id^="editProductUSD_"]');
            let totalUSD = 0;
            productInputs.forEach(input => {
                totalUSD += parseFloat(input.value) || 0;
            });
            
            if (!supplier || patternIdx === '') {
                previewEl.innerHTML = '<p class="text-xs text-slate-500 dark:text-slate-400">パターンを選択してください</p>';
                return;
            }
            
            const pattern = supplier.paymentPatterns[parseInt(patternIdx)];
            if (!pattern) return;
            
            previewEl.innerHTML = pattern.rates.map((rate, idx) => {
                const amount = totalUSD * rate / 100;
                return `
                    <div class="flex justify-between items-center p-2 bg-slate-50 dark:bg-slate-700 rounded">
                        <span class="text-sm dark:text-white">第${idx + 1}回 (${rate}%)</span>
                        <span class="font-semibold text-sm dark:text-white">$${amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                    </div>
                `;
            }).join('');
        }
        
        // グループ編集保存
        async function submitGroupEdit(projectNumber) {
            const groupProjects = projects.filter(p => formatProjectNumber(p) === projectNumber);
            if (groupProjects.length === 0) return;
            
            // 共通設定を取得
            const supplierId = parseInt(document.getElementById('editGroupSupplierId').value) || null;
            // 発注日・集荷予定日：ロット別の入力があればそちらを使う
            const lotDate = (kind, b) => {
                const lotEl = document.getElementById(`editGroup${kind}_${b}`);
                if (lotEl) return lotEl.value;
                const el = document.getElementById(`editGroup${kind}`);
                return el ? el.value : null;
            };
            const workingDays = parseInt(document.getElementById('editGroupWorkingDays').value) || 30;
            
            // デポジットパターン
            const supplier = suppliers.find(s => s.id === supplierId);
            const patternIdx = document.getElementById('editGroupDepositPattern').value;
            
            // 各製品の金額・数量・Serial・製品名を取得
            const productAmounts = {};
            const productQuantities = {};
            const productSerials = {};
            const productNames = {};
            let totalUSD = 0;
            
            groupProjects.forEach((p, idx) => {
                const amountInput = document.getElementById(`editProductUSD_${idx}`);
                const qtyInput = document.getElementById(`editProductQty_${idx}`);
                const serialInput = document.getElementById(`editProductSerial_${idx}`);
                const nameInput = document.getElementById(`editProductName_${idx}`);
                
                if (amountInput) {
                    productAmounts[p.id] = parseFloat(amountInput.value) || 0;
                    totalUSD += productAmounts[p.id];
                }
                if (qtyInput) {
                    productQuantities[p.id] = parseInt(qtyInput.value) || 1;
                }
                if (serialInput) {
                    productSerials[p.id] = serialInput.value.trim();
                }
                if (nameInput) {
                    productNames[p.id] = nameInput.value.trim();
                }
            });
            
            // デポジットスケジュールを作成
            let depositSchedule = [];
            if (supplier && patternIdx !== '') {
                const pattern = supplier.paymentPatterns[parseInt(patternIdx)];
                if (pattern) {
                    depositSchedule = pattern.rates.map((rate, idx) => ({
                        depositNumber: idx + 1,
                        percentage: rate,
                        amountUSD: Math.round(totalUSD * rate / 100 * 100) / 100,
                        paid: false,
                        paidDate: null,
                        exchangeRate: null,
                        amountJPY: null
                    }));
                }
            }
            
            // 各製品を更新
            const oldSerials = groupProjects.map(p => p.serial);
            const oldProductNames = groupProjects.map(p => p.productName);
            
            groupProjects.forEach((p, idx) => {
                p.supplierId = supplierId;
                const b = p.orderBatch || 0;
                const od = lotDate('OrderDate', b);
                const pd = lotDate('PickupDate', b);
                if (od !== null) p.registeredDate = od;
                if (pd !== null) p.pickupDate = pd;
                p.workingDays = workingDays;
                p.totalAmount = productAmounts[p.id] || 0;
                p.quantity = productQuantities[p.id] || 1;
                p.serial = productSerials[p.id] || '';
                p.productName = productNames[p.id] || p.productName;
                
                // デポジット：支払い済みの記録がある製品は作り直さない（支払日・レート・円額を守る）
                const existingDeps = p.depositSchedule || [];
                const hasPaid = existingDeps.some(d => d.paid);
                if (hasPaid) {
                    // 支払い済みの回はそのまま、未払いの回だけ金額を再計算
                    p.depositSchedule = existingDeps.map(d => d.paid ? d : ({
                        ...d,
                        amountUSD: Math.round((p.totalAmount || 0) * (d.percentage || 0) / 100 * 100) / 100
                    }));
                } else if (depositSchedule.length > 0) {
                    // 未払いの製品だけ、選んだパターンで作り直す（製品自身の金額 × 比率）
                    p.depositSchedule = depositSchedule.map(d => ({
                        ...d,
                        amountUSD: Math.round((p.totalAmount || 0) * d.percentage / 100 * 100) / 100
                    }));
                }
            });
            
            // 在庫シートのSerial・製品名も更新（変更があった場合）
            groupProjects.forEach((p, idx) => {
                const serialChanged = oldSerials[idx] !== p.serial;
                const nameChanged = oldProductNames[idx] !== p.productName;
                
                if (serialChanged || nameChanged) {
                    updateInventoryFromProject(
                        formatProjectNumber(p), 
                        oldSerials[idx], 
                        formatProjectNumber(p), 
                        p.serial, 
                        p.quantity, 
                        oldProductNames[idx], 
                        p.productName
                    );
                }
            });
            
            saveData();
            closeGroupEditModal();
            renderMain();
            
            showStatus(`✅ ${groupProjects.length}製品を更新しました`);
            setTimeout(() => showStatus(''), 3000);
        }

        function submitEditProject(projectId) {
            const project = projects.find(p => String(p.id) === String(projectId));
            if (!project) return;
            
            const oldSerial = project.serial;
            const oldProjectNumberFull = formatProjectNumber(project);
            const oldProductName = project.productName;
            
            // 全フィールド更新
            const newProjectPrefix = document.getElementById('editProjectPrefix').value;
            const newProjectNumber = parseInt(document.getElementById('editProjectNumber').value) || 0;
            const newSerial = document.getElementById('editSerial').value.trim();
            const newQuantity = parseInt(document.getElementById('editQuantity').value) || 1;
            const newTotalAmount = parseFloat(document.getElementById('editTotalAmount').value) || 0;
            const newProductName = document.getElementById('editProductName').value.trim();
            
            project.projectPrefix = newProjectPrefix;
            project.projectNumber = newProjectNumber;
            project.productName = newProductName;
            project.supplierId = parseInt(document.getElementById('editSupplierId').value) || null;
            project.totalAmount = newTotalAmount;
            project.quantity = newQuantity;
            project.serial = newSerial;
            project.registeredDate = document.getElementById('editRegisteredDate').value;
            project.workingDays = parseInt(document.getElementById('editWorkingDays').value) || 30;
            project.pickupDate = document.getElementById('editPickupDate').value;
            
            // デポジット情報を更新
            (project.depositSchedule || []).forEach((dep, idx) => {
                dep.paid = document.getElementById(`editDepPaid_${idx}`)?.checked || false;
                dep.amountUSD = parseFloat(document.getElementById(`editDepUSD_${idx}`)?.value) || 0;
                dep.paidDate = document.getElementById(`editDepDate_${idx}`)?.value || null;
                dep.exchangeRate = parseFloat(document.getElementById(`editDepRate_${idx}`)?.value) || null;
                dep.amountJPY = parseFloat(document.getElementById(`editDepJPY_${idx}`)?.value) || null;
            });
            
            const newProjectNumberFull = formatProjectNumber(project);
            
            saveData();
            closeEditProjectModal();
            renderMain();
            
            // Serial、案件番号、または製品名が変更された場合、在庫シートも更新
            if (oldSerial !== newSerial || oldProjectNumberFull !== newProjectNumberFull || oldProductName !== newProductName) {
                updateInventoryFromProject(oldProjectNumberFull, oldSerial, newProjectNumberFull, newSerial, newQuantity, oldProductName, newProductName);
            }
            
            // 支払い情報があれば在庫の取得金を更新
            const totalJPY = (project.depositSchedule || []).reduce((sum, d) => sum + (d.amountJPY || 0), 0);
            if (totalJPY > 0) {
                updateInventoryCostFromProject(project);
            }
        }
        
        // 支払い完了時に在庫の取得金を更新（編集画面からの保存時）
        async function updateInventoryCostFromProject(project) {
            try {
                // 製品代（デポジット合計）
                const totalJPY = (project.depositSchedule || []).reduce((sum, d) => sum + (d.amountJPY || 0), 0);
                
                // 諸費用（原価に含むもののみ、付帯品は除外）
                const expenseTotal = (project.expenses || [])
                    .filter(e => e.includeInCost !== false && !e.isInventoryItem)
                    .reduce((sum, e) => sum + (parseFloat(e.amountJPY) || 0), 0);
                
                const grandTotal = totalJPY + expenseTotal;
                const quantity = project.quantity || 1;
                const costPerItem = Math.round(grandTotal / quantity);
                
                if (costPerItem <= 0) return;
                
                const projectNumber = formatProjectNumber(project);
                const parsed = parseProjectNumberString(projectNumber);
                const productName = project.productName || '';
                const projectPrefix = parsed.prefix.toUpperCase();
                const projectNum = String(parsed.number).padStart(4, '0');
                
                // 在庫シートを読み込み
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A2:Q',
                });
                const rows = response.result.values || [];
                
                // 該当案件のアイテムを検索して更新（案件番号のみで一致）
                const updates = [];
                rows.forEach((row, idx) => {
                    const rowPrefix = (row[4] || '').toUpperCase();
                    const rowNum = String(row[5] || '').padStart(4, '0');
                    
                    if (rowPrefix === projectPrefix && rowNum === projectNum) {
                        const rowIndex = idx + 2;
                        updates.push({
                            range: `在庫!D${rowIndex}`,
                            values: [[productName]]
                        });
                        updates.push({
                            range: `在庫!M${rowIndex}`,
                            values: [[costPerItem]]
                        });
                    }
                });
                
                if (updates.length > 0) {
                    await gapi.client.sheets.spreadsheets.values.batchUpdate({
                        spreadsheetId: SPREADSHEET_ID,
                        resource: {
                            valueInputOption: 'RAW',
                            data: updates
                        }
                    });
                    const itemCount = updates.length / 2;
                    const msg = expenseTotal > 0 
                        ? `✅ 在庫の取得金を更新（¥${costPerItem.toLocaleString()}/台 × ${itemCount}台、諸費用¥${expenseTotal.toLocaleString()}含む）`
                        : `✅ 在庫の取得金を更新（¥${costPerItem.toLocaleString()}/台 × ${itemCount}台）`;
                    showStatus(msg);
                    setTimeout(() => showStatus(''), 3000);
                } else {
                    showStatus(`⚠️ 該当する在庫が見つかりません（${projectPrefix}-${projectNum}）`, 'warning');
                    setTimeout(() => showStatus(''), 3000);
                }
            } catch (err) {
                console.error('在庫取得金更新エラー:', err);
                showStatus('❌ 在庫取得金の更新に失敗しました', 'error');
            }
        }
        
        // デポジット編集の有効/無効切り替え
        function toggleEditDepositFields(idx) {
            const paid = document.getElementById(`editDepPaid_${idx}`).checked;
            document.getElementById(`editDepDate_${idx}`).disabled = !paid;
            document.getElementById(`editDepRate_${idx}`).disabled = !paid;
            document.getElementById(`editDepJPY_${idx}`).disabled = !paid;
            updateDepositTotal();
        }
        
        // 総額変更時に各デポジットのUSDを再計算
        function recalcDepositUSD() {
            const totalAmount = parseFloat(document.getElementById('editTotalAmount')?.value) || 0;
            let idx = 0;
            while (document.getElementById(`editDepUSD_${idx}`)) {
                const usdField = document.getElementById(`editDepUSD_${idx}`);
                const percentage = parseFloat(usdField.dataset.percentage) || 0;
                const usdAmount = Math.round(totalAmount * percentage / 100 * 100) / 100;
                usdField.value = usdAmount;
                // JPYも再計算
                calcDepositJPY(idx);
                idx++;
            }
        }
        
        // USD × レート → JPY 自動計算
        function calcDepositJPY(idx) {
            const usd = parseFloat(document.getElementById(`editDepUSD_${idx}`)?.value) || 0;
            const rate = parseFloat(document.getElementById(`editDepRate_${idx}`)?.value) || 0;
            const jpyField = document.getElementById(`editDepJPY_${idx}`);
            if (jpyField && usd > 0 && rate > 0) {
                jpyField.value = Math.round(usd * rate);
            }
            updateDepositTotal();
        }
        
        // 支払総額を更新
        function updateDepositTotal() {
            let total = 0;
            let idx = 0;
            while (document.getElementById(`editDepJPY_${idx}`)) {
                const jpy = parseFloat(document.getElementById(`editDepJPY_${idx}`).value) || 0;
                total += jpy;
                idx++;
            }
            const totalEl = document.getElementById('editDepTotalJPY');
            if (totalEl) {
                totalEl.textContent = '¥' + total.toLocaleString();
            }
        }

        // 在庫シートの案件情報更新（Serial、案件番号、製品名）
        async function updateInventoryFromProject(oldProjectNumber, oldSerial, newProjectNumber, newSerial, quantity, oldProductName, newProductName) {
            try {
                showStatus('在庫シートを更新中...');
                
                // 新しい案件番号を分解
                const newParsed = parseProjectNumberString(newProjectNumber);
                
                // 在庫データを取得
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A2:Q',
                });
                const rows = response.result.values || [];
                
                const updates = [];
                
                rows.forEach((row, index) => {
                    const rowNum = index + 2; // 実際の行番号（ヘッダー分+1）
                    
                    // 新形式: 接頭辞（E列）+ 番号（F列）を結合して比較
                    const itemProjectNumber = formatProjectNumber({
                        projectPrefix: row[4] || '',
                        projectNumber: row[5] || ''
                    });
                    const itemSerial = row[1] || ''; // Serial（B列）
                    const itemProductName = row[3] || ''; // 製品名（D列）
                    
                    // 旧案件番号に一致し、かつ旧製品名にも一致する場合
                    const projectMatch = itemProjectNumber === oldProjectNumber;
                    const productMatch = !oldProductName || itemProductName === oldProductName;
                    
                    if (projectMatch && productMatch) {
                        // 案件番号を更新（E列：接頭辞、F列：番号）
                        updates.push({
                            range: `在庫!E${rowNum}`,
                            values: [[newParsed.prefix]]
                        });
                        updates.push({
                            range: `在庫!F${rowNum}`,
                            values: [[padProjectNumber(newParsed.number)]]
                        });
                        
                        // 製品名が変更されていれば更新（D列）
                        if (oldProductName && newProductName && oldProductName !== newProductName) {
                            updates.push({
                                range: `在庫!D${rowNum}`,
                                values: [[newProductName]]
                            });
                        }
                        
                        // Serialも変更されていれば更新（B列）
                        if (oldSerial !== newSerial && itemSerial.startsWith(oldSerial.split('(')[0])) {
                            const branchMatch = itemSerial.match(/\((\d+)\)$/);
                            let newSerialValue;
                            if (branchMatch) {
                                newSerialValue = `${newSerial.split('(')[0]}(${branchMatch[1]})`;
                            } else {
                                newSerialValue = newSerial;
                            }
                            updates.push({
                                range: `在庫!B${rowNum}`,
                                values: [[newSerialValue]]
                            });
                        }
                    }
                });
                
                if (updates.length > 0) {
                    await gapi.client.sheets.spreadsheets.values.batchUpdate({
                        spreadsheetId: SPREADSHEET_ID,
                        resource: {
                            valueInputOption: 'RAW',
                            data: updates
                        }
                    });
                    
                    showStatus(`✅ 在庫シート更新完了`);
                    setTimeout(() => showStatus(''), 3000);
                } else {
                    showStatus('');
                }
            } catch (error) {
                console.error('在庫シート更新エラー:', error);
                showStatus('在庫シート更新エラー: ' + error.message);
            }
        }

        // 在庫シートのSerial更新（シンプル版）
        async function updateInventorySerial(projectNumber, oldSerial, newSerial) {
            if (!oldSerial && !newSerial) return;
            if (oldSerial === newSerial) return;
            
            try {
                // 在庫データを取得
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A2:Q',
                });
                const rows = response.result.values || [];
                
                const updates = [];
                
                rows.forEach((row, index) => {
                    const rowNum = index + 2;
                    const itemProjectNumber = formatProjectNumber({
                        projectPrefix: row[4] || '',
                        projectNumber: row[5] || ''
                    });
                    const itemSerial = row[1] || '';
                    
                    // 案件番号が一致し、旧Serialとも一致する場合
                    if (itemProjectNumber === projectNumber && itemSerial === oldSerial) {
                        updates.push({
                            range: `在庫!B${rowNum}`,
                            values: [[newSerial]]
                        });
                    }
                });
                
                if (updates.length > 0) {
                    await gapi.client.sheets.spreadsheets.values.batchUpdate({
                        spreadsheetId: SPREADSHEET_ID,
                        resource: {
                            valueInputOption: 'RAW',
                            data: updates
                        }
                    });
                    console.log(`在庫シートのSerial更新: ${oldSerial} → ${newSerial}`);
                }
            } catch (error) {
                console.error('Serial更新エラー:', error);
            }
        }

        // ==================== 新機能 ====================

        // 在庫のサプライヤーID復旧（緊急用）
        async function repairInventorySupplierIds() {
            if (!confirm('在庫シートのサプライヤーIDを調達データから復旧します。\n\n案件番号をもとに、調達管理のサプライヤー情報を在庫に書き戻します。\n\n続行しますか？')) {
                return;
            }
            
            try {
                showStatus('サプライヤーID復旧中...');
                
                // 案件番号 → サプライヤーIDのマップを作成
                const projectSupplierMap = {};
                projects.forEach(p => {
                    const projectNumber = formatProjectNumber(p);
                    if (p.supplierId) {
                        projectSupplierMap[projectNumber] = p.supplierId;
                    }
                });
                
                console.log('案件→サプライヤーマップ:', projectSupplierMap);
                
                // 在庫データを取得
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A2:Q',
                });
                const rows = response.result.values || [];
                
                const updates = [];
                let repairCount = 0;
                
                rows.forEach((row, index) => {
                    const rowNum = index + 2;
                    const prefix = row[4] || '';
                    const number = row[5] || '';
                    const currentSupplierId = row[16] || ''; // Q列
                    
                    if (prefix && number) {
                        const projectNumber = `${prefix}-${String(number).padStart(4, '0')}`;
                        const supplierId = projectSupplierMap[projectNumber];
                        
                        // サプライヤーIDが見つかり、かつ現在空の場合は更新
                        if (supplierId && !currentSupplierId) {
                            updates.push({
                                range: `在庫!Q${rowNum}`,
                                values: [[supplierId]]
                            });
                            repairCount++;
                        }
                    }
                });
                
                console.log('復旧対象:', repairCount, '件');
                
                if (updates.length > 0) {
                    await gapi.client.sheets.spreadsheets.values.batchUpdate({
                        spreadsheetId: SPREADSHEET_ID,
                        resource: {
                            valueInputOption: 'RAW',
                            data: updates
                        }
                    });
                    
                    showStatus(`✅ サプライヤーID ${repairCount}件を復旧しました`);
                    alert(`${repairCount}件のサプライヤーIDを復旧しました。\n\n在庫管理画面をリロードして確認してください。`);
                } else {
                    showStatus('復旧対象がありません');
                    alert('復旧対象がありませんでした。\n\n・既にサプライヤーIDが設定されている\n・調達に該当案件がない\n\nのいずれかです。');
                }
            } catch (error) {
                console.error('復旧エラー:', error);
                showStatus('復旧エラー: ' + error.message);
                alert('復旧に失敗しました: ' + error.message);
            }
        }

        // 4. 案件ステータス自動更新
        function getProjectStatus(project) {
            const deposits = project.depositSchedule || [];
            const allPaid = deposits.length > 0 && deposits.every(d => d.paid);
            const somePaid = deposits.some(d => d.paid);
            
            // 入庫完了フラグがtrueなら入庫完了
            if (project.receivedComplete) {
                return { status: '入庫完了', color: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300', icon: '✅' };
            }
            
            // 集荷予定日チェック（フォールバック）
            const today = new Date();
            const pickupDate = project.pickupDate ? new Date(project.pickupDate) : null;
            const isPickupPassed = pickupDate && pickupDate < today;

            if (allPaid && isPickupPassed) {
                return { status: '入庫完了', color: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300', icon: '✅' };
            } else if (allPaid) {
                return { status: '支払済', color: 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300', icon: '💵' };
            } else if (somePaid) {
                return { status: '支払中', color: 'bg-amber-100 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300', icon: '💰' };
            } else {
                return { status: '未着手', color: 'bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300', icon: '📝' };
            }
        }

        // 5. フィルタ機能
        // 案件（同一番号）全体のステータス：未払いの製品があればそれを優先
        function getGroupStatus(items) {
            const statuses = items.map(p => getProjectStatus(p));
            const unfinished = statuses.find(st => st.status !== '支払済' && st.status !== '入庫完了');
            if (!unfinished) return statuses[0];
            // 一部でも支払い済みの製品があれば、案件全体は「支払中」
            const anyPaid = items.some(p => (p.depositSchedule || []).some(d => d.paid));
            if (anyPaid) {
                return { status: '支払中', color: 'bg-amber-100 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300', icon: '💰' };
            }
            return unfinished;
        }

        function getFilteredProjects() {
            // 案件番号ごとのステータスを先に計算
            const groupStatusMap = {};
            const byKey = {};
            projects.forEach(p => {
                const key = formatProjectNumber(p);
                (byKey[key] = byKey[key] || []).push(p);
            });
            Object.keys(byKey).forEach(key => {
                groupStatusMap[key] = getGroupStatus(byKey[key]).status;
            });

            return projects.filter(p => {
                const status = groupStatusMap[formatProjectNumber(p)];
                
                // ステータスフィルタ
                if (projectFilter.status !== 'all' && status !== projectFilter.status) {
                    return false;
                }
                
                // サプライヤーフィルタ
                if (projectFilter.supplier !== 'all' && p.supplierId !== parseInt(projectFilter.supplier)) {
                    return false;
                }
                
                // 完了非表示（支払い完了済の案件を非表示にする）
                if (projectFilter.hideArchived && (status === '支払済' || status === '入庫完了')) {
                    return false;
                }
                
                return true;
            });
        }
        
        // 同一案件番号でグループ化
        function getGroupedProjects() {
            const filtered = getFilteredProjects();
            const groups = {};
            
            filtered.forEach(p => {
                const key = formatProjectNumber(p); // e.g. "SP-0029"
                if (!groups[key]) {
                    groups[key] = {
                        projectNumber: key,
                        prefix: p.projectPrefix,
                        number: p.projectNumber,
                        supplierId: p.supplierId,
                        items: [],
                        registeredDate: p.registeredDate,
                        pickupDate: p.pickupDate,
                        workingDays: p.workingDays,
                        depositSchedule: null,
                        expenses: [],
                        receivedComplete: false
                    };
                }
                
                groups[key].items.push(p);
                
                // 諸費用をマージ
                if (p.expenses && p.expenses.length > 0) {
                    groups[key].expenses = groups[key].expenses.concat(p.expenses);
                }
                
                // 入庫完了フラグ（全製品が完了なら完了）
                if (p.receivedComplete) {
                    groups[key].receivedComplete = true;
                }
            });
            
            // デポジット情報を全製品から合算
            Object.values(groups).forEach(g => {
                const allDeposits = {};
                let hasDeposit = false;
                
                g.items.forEach(p => {
                    const batch = p.orderBatch || 0;
                    (p.depositSchedule || []).forEach(dep => {
                        hasDeposit = true;
                        // 発注ロットごとに分けて合算（初回の第1回と追加発注の第1回を混ぜない）
                        const key = `${batch}-${dep.depositNumber}`;
                        if (!allDeposits[key]) {
                            allDeposits[key] = {
                                orderBatch: batch,
                                depositNumber: dep.depositNumber,
                                percentage: dep.percentage,
                                amountUSD: 0,
                                amountJPY: 0,
                                paid: dep.paid,
                                paidDate: dep.paidDate,
                                exchangeRate: dep.exchangeRate
                            };
                        }
                        allDeposits[key].amountUSD += dep.amountUSD || 0;
                        allDeposits[key].amountJPY += dep.amountJPY || 0;
                        // 同じロット内の製品で支払いステータスを同期
                        if (dep.paid) {
                            allDeposits[key].paid = true;
                            allDeposits[key].paidDate = dep.paidDate;
                            allDeposits[key].exchangeRate = dep.exchangeRate;
                        }
                    });
                });
                
                g.depositSchedule = hasDeposit 
                    ? Object.values(allDeposits).sort((a, b) => (a.orderBatch - b.orderBatch) || (a.depositNumber - b.depositNumber))
                    : [];
                g.representativeId = g.items[0]?.id;
            });
            
            // 配列に変換してソート
            return Object.values(groups).sort((a, b) => {
                if (a.prefix !== b.prefix) return a.prefix.localeCompare(b.prefix);
                return b.number - a.number; // 番号降順
            });
        }

        // URLパラメータをチェックして該当案件へスクロール
        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectParam = urlParams.get('project');
            
            if (projectParam) {
                // 案件番号をパース
                const match = projectParam.match(/^([A-Z]+)-(\d+)$/i);
                if (match) {
                    const prefix = match[1].toUpperCase();
                    const number = parseInt(match[2]);
                    
                    // 該当案件を検索
                    const project = projects.find(p => 
                        p.projectPrefix === prefix && p.projectNumber === number
                    );
                    
                    if (project) {
                        // 案件カードを展開してスクロール
                        setTimeout(() => {
                            expandedProjects[project.id] = true;
                            renderMain();
                            setTimeout(() => {
                                scrollToProject(project.id);
                            }, 100);
                        }, 300);
                    } else {
                        showStatus(`案件 ${projectParam} が見つかりません`);
                        setTimeout(() => showStatus(''), 3000);
                    }
                }
                
                // URLパラメータをクリア（履歴を汚さない）
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // 6. 案件削除機能
        function deleteProject(projectId) {
            const project = projects.find(p => String(p.id) === String(projectId));
            if (!project) return;
            
            const hasPaidDeposits = (project.depositSchedule || []).some(d => d.paid);

        async function executeDeleteProject(projectNumber) {
            const groupProjects = projects.filter(p => formatProjectNumber(p) === projectNumber);
            if (groupProjects.length === 0) return;

            // 在庫も削除する場合のみ在庫を削除
            if (inventoryAction === 'delete') {
                try {

                } catch (e) {
                    console.error('在庫削除エラー:', e);
                }
            }
            // 「在庫は残す」の場合は何もしない（在庫データはそのまま）

            renderMain();
            
            showStatus(`✅ 案件「${projectNumber}」を削除しました`);
            setTimeout(() => showStatus(''), 3000);

        // 在庫シートから該当案件のアイテムを削除
        async function deleteInventoryByProject(project) {
            try {
                // シートIDを取得
                const sheetMeta = await gapi.client.sheets.spreadsheets.get({
                    spreadsheetId: SPREADSHEET_ID,
                });
                const inventorySheet = sheetMeta.result.sheets.find(s => s.properties.title === '在庫');
                if (!inventorySheet) {
                    console.error('在庫シートが見つかりません');
                    return;
                }
                const sheetId = inventorySheet.properties.sheetId;
                
                // 在庫データを取得
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A2:Q',
                });
                const rows = response.result.values || [];
                
                const projectPrefix = (project.projectPrefix || 'AD').toUpperCase();
                const projectNum = String(project.projectNumber).padStart(4, '0');
                
                // 削除対象の行番号を収集（1始まり、ヘッダー行の次から）
                const rowsToDelete = [];
                rows.forEach((row, idx) => {
                    const rowPrefix = (row[4] || '').toUpperCase();
                    const rowNumber = String(row[5] || '').padStart(4, '0');
                    if (rowPrefix === projectPrefix && rowNumber === projectNum) {
                        rowsToDelete.push(idx + 2); // idx=0 → 行2（ヘッダーが行1）
                    }
                });
                
                if (rowsToDelete.length === 0) return;
                
                // 後ろの行から削除（降順ソート）※前から消すと行番号がずれるため
                rowsToDelete.sort((a, b) => b - a);
                
                const requests = rowsToDelete.map(rowNum => ({
                    deleteDimension: {
                        range: {
                            sheetId: sheetId,
                            dimension: 'ROWS',
                            startIndex: rowNum - 1, // 0始まりに変換
                            endIndex: rowNum        // 1行だけ削除
                        }
                    }
                }));
                
                await gapi.client.sheets.spreadsheets.batchUpdate({
                    spreadsheetId: SPREADSHEET_ID,
                    resource: { requests }
                });
                
                console.log(`在庫から ${rowsToDelete.length}件を削除しました（行単位削除）`);
            } catch (e) {
                console.error('在庫削除に失敗:', e);
            }
        }

        async function submitExpense(projectId) {
            const project = projects.find(p => String(p.id) === String(projectId));
            if (!project) return;

            const type = document.getElementById('expenseType').value;
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const includeInCost = document.getElementById('expenseIncludeInCost').checked;
            
            // 支払先：ドロップダウンの選択値から payee と supplierId を決定
            const payeeSelectValue = document.getElementById('expensePayeeSelect').value;
            let payee = '';
            let selectedSupplierId = '';
            if (payeeSelectValue === '__other__') {
                // 手動入力
                payee = document.getElementById('expensePayee').value.trim();
            } else if (payeeSelectValue) {
                // 既存suppliersから選択
                const selectedSupplier = suppliers.find(s => String(s.id) === String(payeeSelectValue));
                if (selectedSupplier) {
                    payee = selectedSupplier.name;
                    selectedSupplierId = selectedSupplier.id;
                }
            }
            
            const paidDate = document.getElementById('expensePaidDate').value;
            const note = document.getElementById('expenseNote').value.trim();

            if (!amount || amount <= 0) {
                alert('金額を入力してください');
                return;
            }

            // 付帯品の場合は追加バリデーション
            let itemName = '';
            let itemCategory = '';
            let itemQuantity = 1;
            
            if (type === '付帯品') {
                itemName = document.getElementById('expenseItemName').value.trim();
                itemCategory = document.getElementById('expenseItemCategory').value;
                itemQuantity = parseInt(document.getElementById('expenseItemQuantity').value) || 1;
                
                if (!itemName) {
                    alert('付帯品の品名を入力してください');
                    return;
                }
            }

            if (!project.expenses) {
                project.expenses = [];
            }

            const expenseId = Date.now();
            const expenseData = {
                id: expenseId,
                type: type,
                amountJPY: amount,
                includeInCost: includeInCost,
                payee: payee,
                paidDate: paidDate,
                note: note
            };

            // 付帯品の場合は追加情報を保存
            if (type === '付帯品') {
                expenseData.itemName = itemName;
                expenseData.itemCategory = itemCategory;
                expenseData.itemQuantity = itemQuantity;
                expenseData.isInventoryItem = true;
            }

            project.expenses.push(expenseData);

            // 付帯品の場合は在庫にも登録
            if (type === '付帯品') {
                const projectNumber = formatProjectNumber(project);
                const unitCost = Math.round(amount / itemQuantity);
                
                try {
                    await addToInventory(
                        '',                     // serial（空でOK）
                        itemCategory,           // category
                        itemName,              // productName
                        projectNumber,          // projectNumber
                        paidDate,              // orderDate（支払日を使用）
                        itemQuantity,          // quantity
                        selectedSupplierId,    // supplierId（既存suppliersから選んだ場合のみセット）
                        unitCost               // costPerUnit（取得金）
                    );
                    
                    showStatus(`✅ 付帯品を追加し、在庫にも登録しました（${itemQuantity}点 × ¥${unitCost.toLocaleString()}）`);
                } catch (e) {
                    console.error('在庫登録エラー:', e);
                    showStatus('⚠️ 諸費用は追加しましたが、在庫登録に失敗しました');
                }
            }

            await saveData();
            closeModal('expenseModal');
            renderMain();
            
            // 諸費用（原価に含むもの）を確定したら、本体製品の在庫原価を再反映
            // 付帯品は本体原価に影響しない（在庫には別途1行登録済み）のでスキップ
            if (type !== '付帯品' && includeInCost) {
                await updateInventoryCost(project);
            }
            
            if (type !== '付帯品') {
                showStatus('✅ 諸費用を追加しました');
            }
            setTimeout(() => showStatus(''), 3000);
        }

        async function deleteExpense(projectId, expenseIndex) {
            const project = projects.find(p => String(p.id) === String(projectId));
            if (!project || !project.expenses) return;

            const expense = project.expenses[expenseIndex];
            if (!confirm(`「${expense.type}」(${formatJPY(expense.amountJPY)}) を削除しますか？`)) return;

            // 削除前に「原価に含まれる諸費用だったか」を記録
            const wasInCost = expense.includeInCost !== false && !expense.isInventoryItem;

            project.expenses.splice(expenseIndex, 1);
            await saveData();
            renderMain();

            // 原価に含まれていた諸費用を削除したら、本体製品の在庫原価を再反映
            if (wasInCost) {
                await updateInventoryCost(project);
            }
        }

        async function submitEditExpense(projectId, expenseIndex) {
            const project = projects.find(p => String(p.id) === String(projectId));
            if (!project || !project.expenses || !project.expenses[expenseIndex]) return;

            // 編集前に「原価に含まれていたか」を記録
            const before = project.expenses[expenseIndex];
            const wasInCost = before.includeInCost !== false && !before.isInventoryItem;

            const type = document.getElementById('editExpenseType').value;
            const amount = parseFloat(document.getElementById('editExpenseAmount').value);
            const includeInCost = document.getElementById('editExpenseIncludeInCost').checked;
            const payee = document.getElementById('editExpensePayee').value.trim();
            const paidDate = document.getElementById('editExpensePaidDate').value;
            const note = document.getElementById('editExpenseNote').value.trim();

            if (!amount || amount <= 0) {
                alert('金額を入力してください');
                return;
            }

            project.expenses[expenseIndex] = {
                ...project.expenses[expenseIndex],
                type: type,
                amountJPY: amount,
                includeInCost: includeInCost,
                payee: payee,
                paidDate: paidDate,
                note: note
            };

            // 編集後に「原価に含まれるか」を判定
            const isInCost = includeInCost && !project.expenses[expenseIndex].isInventoryItem;

            await saveData();
            closeModal('editExpenseModal');
            renderMain();

            // 編集前後どちらかで原価に関わっていたら、本体製品の在庫原価を再反映
            if (wasInCost || isInCost) {
                await updateInventoryCost(project);
            }
        }

        function toggleAllocateProject(projectId) {
            if (allocateSelectedProjects.has(projectId)) {
                allocateSelectedProjects.delete(projectId);

            // チェックボックスの状態を更新

            // 選択数を更新

        function changeAllocateMethod(method) {

            document.querySelectorAll('input[name="allocateMethod"]').forEach(radio => {
                const label = radio.closest('label');
                if (radio.value === method) {
                    label.classList.add('border-purple-500');
                    label.classList.remove('border-transparent');

                    label.classList.remove('border-purple-500');

        function updateAllocateIncludeDefault() {
            const type = document.getElementById('allocateExpenseType').value;
            const checkbox = document.getElementById('allocateIncludeInCost');
            const nonCostTypes = ['施工外注費', '設置工事費', '加工費'];
            checkbox.checked = !nonCostTypes.includes(type);
        }

        function updateAllocatePreview() {
            const totalAmount = parseFloat(document.getElementById('allocateTotalAmount').value) || 0;
            const selectedIds = Array.from(allocateSelectedProjects);
            
            if (selectedIds.length === 0 || totalAmount <= 0) {
                document.getElementById('allocateSummary').classList.add('hidden');
                // プレビューをクリア
                selectedIds.forEach(id => {
                    const el = document.getElementById(`allocatePreview_${id}`);
                    if (el) el.textContent = '-';
                });
                return;
            }

            const selectedProjects = selectedIds.map(id => projects.find(p => String(p.id) === String(id))).filter(Boolean);
            
            let allocations = {};
            
            if (allocateMethod === 'amount') {
                // 金額比で按分（支払済み円建て金額ベース）
                const totals = selectedProjects.map(p => {
                    const paidJPY = p.depositSchedule.filter(d => d.paid).reduce((sum, d) => sum + (d.amountJPY || 0), 0);
                    return { id: p.id, value: paidJPY || (p.totalAmount * 150) }; // 未払いの場合は概算
                });
                const grandTotal = totals.reduce((sum, t) => sum + t.value, 0);
                
                if (grandTotal > 0) {
                    totals.forEach(t => {
                        allocations[t.id] = Math.round(totalAmount * t.value / grandTotal);
                    });
                }
            } else if (allocateMethod === 'quantity') {
                // 数量比で按分
                const totalQty = selectedProjects.reduce((sum, p) => sum + (p.quantity || 1), 0);
                selectedProjects.forEach(p => {
                    allocations[p.id] = Math.round(totalAmount * (p.quantity || 1) / totalQty);
                });
            } else {
                // 手動の場合はそのまま
                allocations = { ...allocateManualValues };
            }
            
            // 端数調整（最初の案件に寄せる）
            const allocatedSum = Object.values(allocations).reduce((sum, v) => sum + (v || 0), 0);
            if (allocatedSum !== totalAmount && selectedIds.length > 0 && allocateMethod !== 'manual') {
                allocations[selectedIds[0]] = (allocations[selectedIds[0]] || 0) + (totalAmount - allocatedSum);
            }

            // プレビュー表示を更新
            projects.forEach(p => {
                const el = document.getElementById(`allocatePreview_${p.id}`);
                if (el) {
                    if (allocateSelectedProjects.has(p.id) && allocations[p.id]) {
                        el.innerHTML = allocateMethod === 'manual' 
                            ? `<input type="number" value="${allocations[p.id] || 0}" onchange="updateManualAllocation('${p.id}', this.value)" class="w-20 px-2 py-1 text-right border rounded dark:bg-slate-600 dark:border-slate-500 text-sm">`
                            : formatJPY(allocations[p.id]);
                    } else {
                        el.textContent = '-';
                    }
                }
            });

            // サマリー表示
            const summaryEl = document.getElementById('allocateSummary');
            const summaryTotalEl = document.getElementById('allocateSummaryTotal');
            summaryEl.classList.remove('hidden');
            summaryTotalEl.textContent = formatJPY(Object.values(allocations).reduce((sum, v) => sum + (v || 0), 0));
            
            // 手動の場合は allocateManualValues に保存
            if (allocateMethod !== 'manual') {
                allocateManualValues = allocations;
            }
        }

        function updateManualAllocation(projectId, value) {
            allocateManualValues[projectId] = parseInt(value) || 0;
            // サマリー更新
            const summaryTotalEl = document.getElementById('allocateSummaryTotal');
            if (summaryTotalEl) {
                summaryTotalEl.textContent = formatJPY(Object.values(allocateManualValues).reduce((sum, v) => sum + (v || 0), 0));
            }
        }

        async function executeAllocateExpense() {
            const type = document.getElementById('allocateExpenseType').value;
            const totalAmount = parseFloat(document.getElementById('allocateTotalAmount').value) || 0;
            const includeInCost = document.getElementById('allocateIncludeInCost').checked;
            const payee = document.getElementById('allocatePayee').value.trim();
            const paidDate = document.getElementById('allocatePaidDate').value;
            
            if (totalAmount <= 0) {
                alert('総額を入力してください');
                return;
            }
            
            if (allocateSelectedProjects.size === 0) {
                alert('按分先の案件を選択してください');
                return;
            }

            // 按分計算
            const selectedIds = Array.from(allocateSelectedProjects);
            const selectedProjects = selectedIds.map(id => projects.find(p => String(p.id) === String(id))).filter(Boolean);
            
            let allocations = {};
            
            if (allocateMethod === 'amount') {
                const totals = selectedProjects.map(p => {
                    const paidJPY = p.depositSchedule.filter(d => d.paid).reduce((sum, d) => sum + (d.amountJPY || 0), 0);
                    return { id: p.id, value: paidJPY || (p.totalAmount * 150) };
                });
                const grandTotal = totals.reduce((sum, t) => sum + t.value, 0);
                if (grandTotal > 0) {
                    totals.forEach(t => {
                        allocations[t.id] = Math.round(totalAmount * t.value / grandTotal);
                    });
                }
            } else if (allocateMethod === 'quantity') {
                const totalQty = selectedProjects.reduce((sum, p) => sum + (p.quantity || 1), 0);
                selectedProjects.forEach(p => {
                    allocations[p.id] = Math.round(totalAmount * (p.quantity || 1) / totalQty);
                });
            } else {
                allocations = { ...allocateManualValues };
            }
            
            // 端数調整
            const allocatedSum = Object.values(allocations).reduce((sum, v) => sum + (v || 0), 0);
            if (allocatedSum !== totalAmount && selectedIds.length > 0 && allocateMethod !== 'manual') {
                allocations[selectedIds[0]] = (allocations[selectedIds[0]] || 0) + (totalAmount - allocatedSum);
            }

            // 確認
            const confirmLines = selectedProjects.map(p => 
                `${formatProjectNumber(p)}: ${formatJPY(allocations[p.id] || 0)}`
            ).join('\n');
            
            if (!confirm(`以下の按分で諸費用を追加しますか？\n\n${type}: ${formatJPY(totalAmount)}\n\n${confirmLines}`)) {
                return;
            }

            // 各案件に諸費用を追加
            const allocateId = Date.now(); // 同一按分グループを識別するID
            selectedProjects.forEach(p => {
                if (!p.expenses) p.expenses = [];
                p.expenses.push({
                    id: Date.now() + Math.random(),
                    type: type,
                    amountJPY: allocations[p.id] || 0,
                    includeInCost: includeInCost,
                    payee: payee,
                    paidDate: paidDate,
                    note: `按分 (${formatJPY(totalAmount)}を${selectedProjects.length}件に分配)`,
                    allocateGroupId: allocateId
                });
            });

            await saveData();
            closeModal('allocateExpenseModal');
            renderMain();
            
            showStatus(`✅ ${selectedProjects.length}件に諸費用を按分しました`);
            setTimeout(() => showStatus(''), 3000);
        }

        let invoiceFilesToProcess = [];

        async function scanInvoiceFolder() {
            try {
                const response = await gapi.client.drive.files.list({
                    q: `'${INVOICE_FOLDER_ID}' in parents and mimeType = 'application/pdf' and trashed = false`,
                    fields: 'files(id, name, createdTime, webViewLink)',
                    orderBy: 'createdTime desc',
                    pageSize: 50
                });
                
                const files = response.result.files || [];
                document.getElementById('invoiceSyncLoading').classList.add('hidden');
                document.getElementById('invoiceSyncResult').classList.remove('hidden');
                
                if (files.length === 0) {
                    document.getElementById('invoiceFileList').innerHTML = `
                        <p class="text-center text-slate-500 dark:text-slate-400 py-4">PDFファイルが見つかりません</p>
                    `;
                    document.getElementById('invoiceSyncSummary').innerHTML = `
                        <p class="text-sm text-slate-600 dark:text-slate-400">
                            📁 フォルダにPDFを追加してください<br>
                            <span class="text-xs">ファイル名形式: <code class="bg-slate-200 dark:bg-slate-600 px-1 rounded">YYMM_海外請求書_AD-XXXX_サプライヤー名_製品名.pdf</code></span>
                        </p>
                    `;
                    return;
                }
                
                // ファイル名から情報を抽出
                invoiceFilesToProcess = files.map(file => {
                    const parsed = parseInvoiceFileName(file.name);
                    
                    // 案件番号で既存チェック
                    let existingProject = null;
                    if (parsed.projectNumber) {
                        const pn = parseProjectNumberString(parsed.projectNumber);
                        existingProject = projects.find(p => 
                            (p.projectPrefix || 'AD') === pn.prefix && 
                            parseInt(p.projectNumber) === pn.number
                        );
                    }
                    
                    // 既に同じ案件番号が登録されていれば登録済みとする
                    const alreadyRegistered = !!existingProject;
                    
                    return {
                        ...file,
                        ...parsed,
                        existingProject,
                        alreadyRegistered,

        // ファイル名からインボイス情報を抽出
        // 例: 2512_海外請求書_AD-1681_ZEMSO_VW_55_20pcs.pdf
        function parseInvoiceFileName(fileName) {
            const result = {
                projectNumber: null,
                supplierName: null
            };
            
            // AD-XXXX パターン
            const projectMatch = fileName.match(/_(AD-\d+)/i);
            if (projectMatch) {
                result.projectNumber = projectMatch[1].toUpperCase();
            }
            
            // サプライヤー名（AD-XXXXの後の部分）
            const supplierMatch = fileName.match(/_AD-\d+_([^_]+)/i);
            if (supplierMatch) {
                result.supplierName = supplierMatch[1];
            }
            
            return result;
        }
